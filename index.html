<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="AI maths tutor for Pearson Edexcel A level: Pure 2 Chapter 7 and Applied 2 Chapter 5.">
<meta name="theme-color" content="#2a45c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maths Tutor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Edexcel Maths Tutor</title>
<meta name="claude:viewport-fit-sides" content="cover">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: an exam-paper workbook. Narrow reading column, question sheets with Pearson-style "(3)" marks and a red-pen mark scheme table. */
:root{
  --bg:#edf0f6; --paper:#ffffff; --ink:#151f36; --muted:#5a6580; --line:#d4dae6;
  --accent:#2a45c4; --accent-ink:#ffffff; --accent-soft:#e2e7fb;
  --pen:#bf3426; --pen-soft:#fbe8e5; --ok:#1d7a4b; --ok-soft:#def2e7; --hl:#fff0a3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1420; --paper:#161f31; --ink:#e5e9f2; --muted:#98a3bd; --line:#29344c;
  --accent:#93a6ff; --accent-ink:#0e1420; --accent-soft:#212c4e;
  --pen:#ff8b7b; --pen-soft:#3b2226; --ok:#6fd3a0; --ok-soft:#163427; --hl:#5b4e12; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1420; --paper:#161f31; --ink:#e5e9f2; --muted:#98a3bd; --line:#29344c;
  --accent:#93a6ff; --accent-ink:#0e1420; --accent-soft:#212c4e;
  --pen:#ff8b7b; --pen-soft:#3b2226; --ok:#6fd3a0; --ok-soft:#163427; --hl:#5b4e12; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:28px}
.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted);font-weight:700}
.nav button[aria-current="page"]{background:var(--paper);border-color:var(--line);color:var(--ink)}
.ai-pill{font:500 .72rem var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:3px 10px}
.ai-pill{background:none;cursor:pointer}
.ai-pill.on{color:var(--ok);border-color:currentColor;border-style:solid}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.92rem;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:progress}
.btn .count{font:500 .75rem var(--f-mono);opacity:.75}

/* Home */
.intro{display:grid;gap:10px;margin-bottom:28px}
.intro p{color:var(--muted);max-width:62ch}
.chapters{display:grid;gap:10px}
.chapter{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ch-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 .74rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-row{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.sec-row:last-child{border-bottom:0}
.sec-num{font:700 .95rem var(--f-mono);color:var(--accent)}
.sec-title{font-weight:700;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.sec-title:hover{color:var(--accent)}
.sec-prog{display:flex;align-items:center;gap:8px;color:var(--muted);font:500 .78rem var(--f-mono);font-variant-numeric:tabular-nums}
.bar{width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.sec-acts{display:flex;gap:6px}
@media (max-width:560px){.sec-row{grid-template-columns:2.6rem minmax(0,1fr)}.sec-acts{grid-column:2}.sec-prog{grid-column:2}}
.books{display:grid;gap:30px}
.book{display:grid;gap:12px}
.book-title{font-size:1.15rem;color:var(--muted)}
details.chapter > summary{list-style:none;cursor:pointer}
details.chapter > summary::-webkit-details-marker{display:none}
details.chapter > summary::after{content:"Show sections ▾";font:500 .75rem var(--f-mono);color:var(--accent);white-space:nowrap}
details.chapter[open] > summary::after{content:"Hide ▴"}
details.chapter:not([open]) > summary{border-bottom:0}
.ch-head h3{font-size:1.1rem}
.ch-tools{padding:10px 20px;border-bottom:1px solid var(--line)}
.ask-cta{margin-top:22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.ask-cta p{color:var(--muted);max-width:52ch}

/* Section page */
.crumbs{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:700}
.sec-header{display:grid;gap:14px;margin-bottom:22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Rendered notes / markdown */
.md{min-width:0;overflow-wrap:anywhere}
.md > * + *{margin-top:.8em}
.md h2{margin-top:1.4em}
.md h3{margin-top:1.5em;color:var(--ink)}
.md h2:first-child,.md h3:first-child{margin-top:0}
.md ul,.md ol{padding-left:1.4em;margin-bottom:0}
.md li + li{margin-top:.3em}
.md blockquote{margin:1em 0;padding:10px 16px;background:var(--accent-soft);border-radius:8px;overflow-x:auto}
.md blockquote p{margin:0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.md th{background:var(--bg)}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--bg);padding:1px 5px;border-radius:4px}
.md pre{overflow-x:auto;background:var(--bg);padding:10px;border-radius:8px}
.md strong{font-weight:700}
.md .katex{font-size:1.08em}
.md .katex-display{overflow-x:auto;overflow-y:hidden;max-width:100%;padding-block:4px;margin:.6em 0}
.mk{float:right;font-weight:700;margin-left:12px;font-variant-numeric:tabular-nums}
.notes{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(16px,4vw,32px)}
.notes-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.stuck{margin-top:22px;display:grid;gap:8px;padding:16px;border:1px dashed var(--line);border-radius:var(--r)}
.stuck .row{display:flex;gap:8px;flex-wrap:wrap}
.stuck input{flex:1 1 240px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper)}

/* Practice */
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.qpill{min-width:2.3rem;height:2.3rem;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font:700 .85rem var(--f-mono)}
.qpill.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qpill.part{background:var(--hl)}
.qpill[aria-current="true"]{outline:2px solid var(--accent);outline-offset:1px}
.qpill.ai{border-style:dashed}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,4vw,28px);display:grid;gap:16px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px}
.qnum{font:700 1.25rem var(--f-display)}
.qmeta{display:flex;gap:10px;align-items:center;color:var(--muted);font:500 .78rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;flex-wrap:wrap}
.dots{letter-spacing:2px;color:var(--accent)}
.tag{border:1px dashed var(--muted);border-radius:4px;padding:1px 6px}
.qbody{font-size:1.05rem}
.work{display:grid;gap:6px}
.work label.lbl{font:500 .75rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);resize:vertical;line-height:1.5}
.work-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);cursor:pointer;font-size:.8rem;line-height:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.panel{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.panel-title{font:700 .78rem var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hint{background:var(--hl);border-radius:8px;padding:10px 14px;display:flex;gap:8px;align-items:baseline}
.hint > div{min-width:0}
.hint b{font-family:var(--f-mono);font-size:.8rem;margin-right:6px}
.scheme-wrap{overflow-x:auto}
table.scheme{border-collapse:collapse;width:100%}
table.scheme td.md{overflow-wrap:anywhere}
@media (max-width:480px){table.scheme td,table.scheme th{padding:6px 4px}table.scheme td.tick{width:2.6rem}}
table.scheme th{font:700 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line)}
table.scheme td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.scheme td.code{font:700 .9rem var(--f-mono);color:var(--pen);white-space:nowrap}
table.scheme td.part{font:500 .85rem var(--f-mono);color:var(--muted);white-space:nowrap}
table.scheme td.tick{text-align:center;width:4.5rem}
table.scheme input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
table.scheme tr.final td{background:var(--pen-soft)}
.score{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:700}
.score .big{font:700 1.5rem var(--f-mono);color:var(--pen);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.verdict{display:inline-block;font:700 .75rem var(--f-mono);padding:2px 8px;border-radius:4px}
.verdict.yes{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--pen-soft);color:var(--pen)}
.gen-bar{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.gen-bar p{flex:1 1 260px;color:var(--muted);font-size:.92rem}
.status{font-size:.9rem;color:var(--muted)}
.status.err{color:var(--pen)}
.thinking::after{content:"";display:inline-block;width:1em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* Ask */
.composer{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:.92rem}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop label{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline}
.comp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);max-width:100%}
.examples{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.86rem}
.chip:hover{border-color:var(--accent)}
.thread{display:grid;gap:16px;margin-top:22px}
.msg-me{justify-self:end;max-width:min(100%,560px);background:var(--accent-soft);border-radius:var(--r) var(--r) 2px var(--r);padding:12px 16px;display:grid;gap:8px}
.msg-me p{white-space:pre-wrap;overflow-wrap:anywhere}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,4vw,28px)}
.sheet .who{font:700 .74rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.follow{display:grid;gap:10px;padding:16px;border:1px dashed var(--accent);border-radius:var(--r)}
.follow .row{display:flex;gap:8px;flex-wrap:wrap}
.follow input{flex:1 1 240px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper)}
.notice{padding:12px 16px;border-radius:8px;background:var(--pen-soft);color:var(--ink);font-size:.92rem}
.stars{color:var(--accent);letter-spacing:1px;font-size:.95rem}
.stars .off{color:var(--line)}
.fig{margin:0;max-width:440px}
.fig svg{display:block;width:100%;height:auto;color:var(--ink)}
.md .fig{margin:1em auto}
.qfig{display:flex;justify-content:center}
.filters{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[disabled]{opacity:.45;cursor:default}
.chip .count{font:500 .72rem var(--f-mono);opacity:.8}
label.chip{display:inline-flex;gap:6px;align-items:center}
label.chip input{accent-color:var(--accent)}
.timer{font:700 .8rem var(--f-mono);color:var(--ink);background:var(--bg);border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums}
.timer.over{color:var(--pen);background:var(--pen-soft)}
.md .booklet{border-left:3px solid var(--accent);padding:8px 14px;background:var(--bg);border-radius:0 8px 8px 0}
.field{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-family:var(--f-mono);font-size:.9rem}
.models{border:0;padding:0;margin:0;display:grid;gap:8px}
.models legend{margin-bottom:6px}
.model{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.model:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.model > span{display:grid;gap:2px}

<script>
const R = String.raw;

/* ------------------------------------------------------------------ */
/* Course content                                                     */
/* ------------------------------------------------------------------ */
/* ------------------------------------------------------------------ */
/* Diagrams. Each helper returns an inline SVG string that follows the */
/* page theme: geometry in ink, forces in the accent, weight in red.   */
/* ------------------------------------------------------------------ */
const Fig = (() => {
  const INK = 'var(--ink)', MUTE = 'var(--muted)', FORCE = 'var(--accent)', WEIGHT = 'var(--pen)', SOFT = 'var(--accent-soft)';
  const rad = d => d * Math.PI / 180;
  const n2 = v => Math.round(v * 10) / 10;
  const escT = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function wrap(w, h, body, label){
    return `<figure class="fig"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${escT(label)}" font-family="var(--f-body)" font-size="14">${body}</svg></figure>`;
  }
  function text(x, y, s, { col = INK, anchor = 'middle', size = 14, italic = false, weight = 'normal' } = {}){
    return `<text x="${n2(x)}" y="${n2(y)}" fill="${col}" text-anchor="${anchor}" dominant-baseline="middle" font-size="${size}" font-weight="${weight}"${italic ? ' font-style="italic"' : ''}>${escT(s)}</text>`;
  }
  function line(x1, y1, x2, y2, { col = INK, w = 1.6, dash = '' } = {}){
    return `<line x1="${n2(x1)}" y1="${n2(y1)}" x2="${n2(x2)}" y2="${n2(y2)}" stroke="${col}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''} stroke-linecap="round"/>`;
  }
  // Arrow in SVG coordinates, with a filled head at (x2, y2).
  function arrow(x1, y1, x2, y2, col = FORCE, w = 2.2, dash = ''){
    const a = Math.atan2(y2 - y1, x2 - x1), hl = 10, hw = 5;
    const bx = x2 - hl * Math.cos(a), by = y2 - hl * Math.sin(a);
    const p1 = [bx + hw * Math.sin(a), by - hw * Math.cos(a)], p2 = [bx - hw * Math.sin(a), by + hw * Math.cos(a)];
    return line(x1, y1, bx, by, { col, w, dash }) + `<polygon points="${n2(x2)},${n2(y2)} ${n2(p1[0])},${n2(p1[1])} ${n2(p2[0])},${n2(p2[1])}" fill="${col}"/>`;
  }
  // Arc for an angle at (cx, cy) between directions a1 and a2 (degrees, anticlockwise from +x, maths sense).
  function arc(cx, cy, r, a1, a2, label, { col = MUTE, lr = r + 14 } = {}){
    const x1 = cx + r * Math.cos(rad(a1)), y1 = cy - r * Math.sin(rad(a1));
    const x2 = cx + r * Math.cos(rad(a2)), y2 = cy - r * Math.sin(rad(a2));
    const large = Math.abs(a2 - a1) > 180 ? 1 : 0, sweep = a2 > a1 ? 0 : 1;
    const mid = (a1 + a2) / 2;
    return `<path d="M${n2(x1)},${n2(y1)} A${r},${r} 0 ${large} ${sweep} ${n2(x2)},${n2(y2)}" fill="none" stroke="${col}" stroke-width="1.4"/>`
      + (label ? text(cx + lr * Math.cos(rad(mid)), cy - lr * Math.sin(rad(mid)), label, { col, size: 13 }) : '');
  }
  // Label for a resolved component: "30 N" at 20° gives "30 cos 20°"; "mg" on slope α gives "mg sin α".
  const compLabel = (lab, fn, ang) => `${String(lab).replace(/\s*N$/, '')} ${fn} ${ang}`;
  // Dashed component arrow with a label placed off to one side of its middle.
  function comp(x1, y1, x2, y2, lab, side, col){
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, L = Math.hypot(x2 - x1, y2 - y1) || 1;
    const ox = -(y2 - y1) / L * side, oy = (x2 - x1) / L * side;
    const dx = String(lab).length * 3.1 * Math.abs(ox / Math.abs(side || 1));
    return arrow(x1, y1, x2, y2, col, 1.6, '5 4') + text(mx + ox + Math.sign(ox) * dx, my + oy, lab, { col, size: 12 });
  }
  function rightAngle(x, y, d1, d2, s = 10){
    const ax = x + s * Math.cos(rad(d1)), ay = y - s * Math.sin(rad(d1));
    const bx = x + s * Math.cos(rad(d2)), by = y - s * Math.sin(rad(d2));
    const cx = ax + s * Math.cos(rad(d2)), cy = ay - s * Math.sin(rad(d2));
    return `<path d="M${n2(ax)},${n2(ay)} L${n2(cx)},${n2(cy)} L${n2(bx)},${n2(by)}" fill="none" stroke="${MUTE}" stroke-width="1.3"/>`;
  }
  // A force arrow from (x, y) in direction deg, with its label beyond the tip.
  function force(x, y, deg, len, label, col = FORCE){
    const x2 = x + len * Math.cos(rad(deg)), y2 = y - len * Math.sin(rad(deg));
    const off = 12 + String(label || '').length * 3.6 * Math.abs(Math.cos(rad(deg))) + 6 * Math.abs(Math.sin(rad(deg)));
    const lx = x + (len + off) * Math.cos(rad(deg)), ly = y - (len + off) * Math.sin(rad(deg));
    return arrow(x, y, x2, y2, col) + (label ? text(lx, ly, label, { col, weight: 'bold' }) : '');
  }

  /* Particle with forces. forces: [{deg, label, len, weight:true}], angles: [{from, to, label, r}], ref: dashed axes. */
  function particle({ forces = [], angles = [], ref = false, w = 340, h = 230, label = 'Force diagram', mass = '' } = {}){
    const cx = w / 2, cy = h / 2;
    let body = '';
    if (ref) body += line(cx - 100, cy, cx + 100, cy, { col: MUTE, w: 1, dash: '4 4' }) + line(cx, cy - 90, cx, cy + 90, { col: MUTE, w: 1, dash: '4 4' });
    angles.forEach(a => { body += arc(cx, cy, a.r || 34, a.from, a.to, a.label); });
    forces.forEach(f => { body += force(cx, cy, f.deg, f.len || 72, f.label, f.weight ? WEIGHT : FORCE); });
    body += `<circle cx="${cx}" cy="${cy}" r="6" fill="${INK}"/>`;
    if (mass) body += text(cx + 14, cy + 14, mass, { col: INK, anchor: 'start', size: 13 });
    return wrap(w, h, body, label);
  }

  /* Particle hanging from strings fixed to a ceiling. strings: [{deg, label}] measured from +x (e.g. 150 = up-left). */
  function hanging({ strings = [], extra = [], weightLabel = 'mg', angles = [], w = 340, h = 230, label = 'Particle held by strings' } = {}){
    const cx = w / 2, top = 30;
    // Keep both fixed points on the ceiling inside the picture: shallow strings need a smaller drop.
    const drop = Math.min(120, ...strings.map(st => (cx - 24) * Math.tan(rad(st.deg > 90 ? 180 - st.deg : st.deg))));
    const cy = top + Math.max(drop, 60);
    let body = line(20, top, w - 20, top, { col: INK, w: 2 });
    for (let x = 26; x < w - 20; x += 12) body += line(x, top, x - 8, top - 8, { col: MUTE, w: 1 });
    strings.forEach(s => {
      const t = (cy - top) / Math.sin(rad(s.deg));
      const ex = cx + t * Math.cos(rad(s.deg));
      body += line(cx, cy, ex, top, { col: INK, w: 1.4 });
      body += force(cx, cy, s.deg, 58, s.label);
      if (s.angleLabel){
        const [a1, a2] = s.deg > 90 ? [s.deg - 180, 0] : [180, s.deg + 180];
        body += arc(ex, top, 26, a1, a2, s.angleLabel, { lr: 42 });
      }
    });
    extra.forEach(f => { body += force(cx, cy, f.deg, f.len || 60, f.label); });
    angles.forEach(a => { body += arc(cx, cy, a.r || 30, a.from, a.to, a.label); });
    body += force(cx, cy, 270, 52, weightLabel, WEIGHT);
    body += `<circle cx="${cx}" cy="${cy}" r="6" fill="${INK}"/>`;
    return wrap(w, cy + 80, body, label);
  }

  /* Inclined plane rising to the right at deg. forces use dir: 'up' | 'down' | 'normal' | 'weight' | 'horiz' | {rel: β} (β above the slope).
     pulley: {label, weightLabel} hangs a second particle over a pulley at the top. */
  function slope({ deg = 30, angleLabel, forces = [], pulley = null, label = 'Particle on an inclined plane', motion = '', components = true } = {}){
    const L = 300, A = [24, 0];
    const w = 360, hgt = L * Math.sin(rad(deg));
    const h = Math.max(150, hgt + (pulley ? 120 : 70));
    const base = h - 22;
    A[1] = base;
    const C = [A[0] + L * Math.cos(rad(deg)), base - hgt];
    let body = `<polygon points="${n2(A[0])},${n2(base)} ${n2(C[0])},${n2(base)} ${n2(C[0])},${n2(C[1])}" fill="${SOFT}" stroke="${INK}" stroke-width="1.6"/>`;
    body += arc(A[0], base, 38, 0, deg, angleLabel || (deg + '°'), { lr: 54 });
    const f = pulley ? 0.55 : 0.5;
    const P = [A[0] + f * L * Math.cos(rad(deg)), base - f * L * Math.sin(rad(deg))];
    const nx = -Math.sin(rad(deg)), ny = Math.cos(rad(deg));
    const B = [P[0] + 13 * nx, P[1] - 13 * ny]; // block centre, sitting on the surface
    body += `<rect x="${n2(B[0] - 20)}" y="${n2(B[1] - 13)}" width="40" height="26" rx="3" fill="var(--paper)" stroke="${INK}" stroke-width="1.6" transform="rotate(${-deg} ${n2(B[0])} ${n2(B[1])})"/>`;
    const dirDeg = d => d === 'up' ? deg : d === 'down' ? deg + 180 : d === 'normal' ? deg + 90 : d === 'weight' ? 270 : d === 'horiz' ? 0 : d === 'horizL' ? 180 : (d && d.rel != null) ? deg + d.rel : Number(d);
    const ang = angleLabel || (deg + '°');
    forces.forEach(fc => {
      const dd = dirDeg(fc.dir);
      const len = fc.len || (fc.dir === 'weight' ? 62 : 58);
      if (components && fc.dir === 'weight' && fc.label){
        // weight = (component into the plane) + (component down the slope): draw them as a dashed triangle
        const c1 = len * Math.cos(rad(deg)), qx = B[0] + c1 * Math.sin(rad(deg)), qy = B[1] + c1 * Math.cos(rad(deg));
        body += comp(B[0], B[1], qx, qy, compLabel(fc.label, 'cos', ang), -14, WEIGHT);
        body += comp(qx, qy, B[0], B[1] + len, compLabel(fc.label, 'sin', ang), -14, WEIGHT);
      }
      if (components && fc.dir === 'horiz' && fc.label){
        // a horizontal push = (up the slope) + (into the plane)
        const c1 = len * Math.cos(rad(deg)), qx = B[0] + c1 * Math.cos(rad(deg)), qy = B[1] - c1 * Math.sin(rad(deg));
        body += comp(B[0], B[1], qx, qy, compLabel(fc.label, 'cos', ang), -18, FORCE);
        body += comp(qx, qy, B[0] + len, B[1], compLabel(fc.label, 'sin', ang), -16, FORCE);
      }
      body += force(B[0], B[1], dd, len, fc.label, fc.dir === 'weight' ? WEIGHT : FORCE);
      if (fc.dir && fc.dir.rel && fc.relLabel){
        body += line(B[0], B[1], B[0] + 70 * Math.cos(rad(deg)), B[1] - 70 * Math.sin(rad(deg)), { col: MUTE, w: 1, dash: '4 4' });
        body += arc(B[0], B[1], 30, deg, deg + fc.dir.rel, fc.relLabel, { lr: 44 });
      }
    });
    if (motion) body += text(B[0] - 70 * Math.cos(rad(deg)) + 18 * nx, B[1] + 70 * Math.sin(rad(deg)) - 40 * ny, motion, { col: MUTE, size: 12 });
    if (pulley){
      const pr = 10, pc = [C[0] - 2, C[1] - 4];
      body += `<circle cx="${n2(pc[0])}" cy="${n2(pc[1])}" r="${pr}" fill="var(--paper)" stroke="${INK}" stroke-width="1.6"/>`;
      const sx = B[0] + 20 * Math.cos(rad(deg)), sy = B[1] - 20 * Math.sin(rad(deg));
      body += line(sx, sy, pc[0] - pr * Math.sin(rad(deg)), pc[1] - pr * Math.cos(rad(deg)), { col: INK, w: 1.3 });
      const hx = pc[0] + pr, hy = pc[1] + 64;
      body += line(hx, pc[1], hx, hy - 12, { col: INK, w: 1.3 });
      body += `<rect x="${n2(hx - 12)}" y="${n2(hy - 12)}" width="24" height="24" rx="3" fill="var(--paper)" stroke="${INK}" stroke-width="1.6"/>`;
      if (pulley.name) body += text(hx + 22, hy, pulley.name, { anchor: 'start', size: 13 });
      body += force(hx, hy + 12, 270, 30, pulley.weightLabel || 'mg', WEIGHT);
      if (pulley.tension) body += force(hx, hy - 12, 90, 26, '', FORCE) + text(hx - 14, hy - 34, pulley.tension, { col: FORCE, weight: 'bold', anchor: 'end' });
      if (pulley.blockName) body += text(B[0] - 30 * nx, B[1] + 30 * ny, pulley.blockName, { size: 13 });
    }
    return wrap(w, h, body, label);
  }

  /* Flat ground with a block; forces as in particle(). */
  function ground({ forces = [], angles = [], label = 'Block on horizontal ground', rough = false, motion = '' } = {}){
    const w = 360, h = 210, gy = 150, bx = 150, by = gy - 16;
    let body = line(20, gy, w - 20, gy, { col: INK, w: 2 });
    if (rough) for (let x = 26; x < w - 20; x += 12) body += line(x, gy, x - 8, gy + 8, { col: MUTE, w: 1 });
    body += `<rect x="${bx - 26}" y="${gy - 32}" width="52" height="32" rx="3" fill="var(--paper)" stroke="${INK}" stroke-width="1.6"/>`;
    angles.forEach(a => {
      body += line(bx, by, bx + 70, by, { col: MUTE, w: 1, dash: '4 4' });
      body += arc(bx, by, a.r || 34, a.from, a.to, a.label);
    });
    forces.forEach(f => {
      const angled = !f.weight && f.label && f.deg % 90 !== 0 && f.components !== false;
      const len = f.len || 64;
      if (angled){
        const ang = (angles[0] && angles[0].label) || (Math.abs(f.deg) + '°');
        const hx = bx + len * Math.cos(rad(f.deg)), ty = by - len * Math.sin(rad(f.deg));
        body += arrow(bx, by, hx, by, FORCE, 1.6, '5 4') + text(hx + 4, by + 13, compLabel(f.label, 'cos', ang), { col: FORCE, size: 12, anchor: 'start' });
        body += arrow(hx, by, hx, ty, FORCE, 1.6, '5 4') + text(hx + 8, (by + ty) / 2 + 2, compLabel(f.label, 'sin', ang), { col: FORCE, size: 12, anchor: 'start' });
      }
      body += force(bx, by, f.deg, len, f.label, f.weight ? WEIGHT : FORCE);
    });
    if (motion) body += arrow(28, 26, 88, 26, MUTE, 1.4) + text(96, 26, motion, { col: MUTE, size: 12, anchor: 'start' });
    return wrap(w, h, body, label);
  }

  /* Geometry: points {A:[x,y]} in maths coordinates (y up, roughly 0..10), segments 'AB BC', right angles, angle marks and side labels. */
  function geo({ pts, segs, labels = {}, right = [], angles = [], sides = [], label = 'Diagram', w = 320, h = 220, pad = 30 } = {}){
    const xs = Object.values(pts).map(p => p[0]), ys = Object.values(pts).map(p => p[1]);
    const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    const s = Math.min((w - 2 * pad) / (maxx - minx || 1), (h - 2 * pad) / (maxy - miny || 1));
    const ox = (w - s * (maxx - minx)) / 2, oy = (h - s * (maxy - miny)) / 2;
    const P = k => [ox + s * (pts[k][0] - minx), h - oy - s * (pts[k][1] - miny)];
    const ang = (a, b) => { const p = P(a), q = P(b); return Math.atan2(-(q[1] - p[1]), q[0] - p[0]) * 180 / Math.PI; };
    let body = '';
    segs.split(' ').forEach(sg => { const p = P(sg[0]), q = P(sg[1]); body += line(p[0], p[1], q[0], q[1], { col: INK, w: 1.8 }); });
    right.forEach(r => { const p = P(r[1]); body += rightAngle(p[0], p[1], ang(r[1], r[0]), ang(r[1], r[2]), 11); });
    angles.forEach(a => {
      const p = P(a.at); let d1 = ang(a.at, a.from), d2 = ang(a.at, a.to);
      if (d2 < d1) [d1, d2] = [d2, d1];
      if (d2 - d1 > 180) { const t = d1; d1 = d2; d2 = t + 360; }
      body += arc(p[0], p[1], a.r || 26, d1, d2, a.label, { lr: (a.r || 26) + 15 });
    });
    sides.forEach(sd => { const p = P(sd.on[0]), q = P(sd.on[1]); const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1; const off = sd.off || 14;
      body += text(mx - dy / L * off, my + dx / L * off, sd.label, { col: MUTE, size: 13 }); });
    Object.keys(pts).forEach(k => { const p = P(k); const o = labels[k] || [0, 0];
      body += text(p[0] + o[0], p[1] + o[1], k, { weight: 'bold', size: 14 }); });
    return wrap(w, h, body, label);
  }

  /* Graph of y = f(x). fns: [{f, label}], ticks as [value, text]. */
  function graph({ fns, x0, x1, y0, y1, xticks = [], yticks = [], hlines = [], points = [], xlab = 'x', ylab = 'y', w = 380, h = 230, label = 'Graph' } = {}){
    const L = 44, Rr = 16, T = 14, B = 34;
    const X = x => L + (x - x0) / (x1 - x0) * (w - L - Rr), Y = y => T + (y1 - y) / (y1 - y0) * (h - T - B);
    let body = '';
    yticks.forEach(([v, s]) => { body += line(L, Y(v), w - Rr, Y(v), { col: 'var(--line)', w: 1 }) + text(L - 6, Y(v), s, { col: MUTE, anchor: 'end', size: 11 }); });
    xticks.forEach(([v, s]) => { body += line(X(v), T, X(v), h - B, { col: 'var(--line)', w: 1 }) + text(X(v), h - B + 14, s, { col: MUTE, size: 11 }); });
    const zy = Math.min(Math.max(Y(0), T), h - B), zx = Math.min(Math.max(X(0), L), w - Rr);
    body += line(L, zy, w - Rr, zy, { col: INK, w: 1.3 }) + line(zx, T, zx, h - B, { col: INK, w: 1.3 });
    body += text(w - Rr, zy - 10, xlab, { col: MUTE, anchor: 'end', size: 12, italic: true }) + text(zx + 8, T + 4, ylab, { col: MUTE, anchor: 'start', size: 12, italic: true });
    hlines.forEach(hl => { body += line(L, Y(hl.y), w - Rr, Y(hl.y), { col: WEIGHT, w: 1.3, dash: '5 4' }) + (hl.label ? text(w - Rr - 2, Y(hl.y) - 9, hl.label, { col: WEIGHT, anchor: 'end', size: 11 }) : ''); });
    fns.forEach((fn, i) => {
      let d = '';
      for (let k = 0; k <= 240; k++){ const x = x0 + (x1 - x0) * k / 240, y = fn.f(x); d += (k ? 'L' : 'M') + n2(X(x)) + ',' + n2(Y(y)); }
      body += `<path d="${d}" fill="none" stroke="${i ? WEIGHT : FORCE}" stroke-width="2.2"/>`;
      if (fn.label) body += text(X(fn.lx != null ? fn.lx : x1) - 4, Math.max(T + 8, Y(fn.ly != null ? fn.ly : fn.f(x1)) - 12), fn.label, { col: i ? WEIGHT : FORCE, anchor: 'end', size: 12 });
    });
    points.forEach(p => { body += `<circle cx="${n2(X(p.x))}" cy="${n2(Y(p.y))}" r="4" fill="${INK}"/>` + (p.label ? text(X(p.x) + (p.dx || 0), Y(p.y) + (p.dy || -14), p.label, { size: 12 }) : ''); });
    return wrap(w, h, body, label);
  }

  return { particle, hanging, slope, ground, geo, graph };
})();

function Q(id, stars, q, hints, scheme, answer, sol, extra){

  return Object.assign({ id, stars, q, hints, scheme: scheme.map(line), answer, sol }, extra || {});
}

notes: R`
### The index laws
> $$a^m \times a^n = a^{m+n} \qquad a^m \div a^n = a^{m-n} \qquad (a^m)^n = a^{mn} \qquad (ab)^n = a^nb^n$$

- **Multiplying** the same base: **add** the powers.
- **Dividing**: **subtract** the powers.
- **A power of a power**: **multiply** the powers.
- A bracket raised to a power: raise **every** factor inside, numbers included.

Numbers and letters are dealt with separately: $3x^2 \times 4x^5 = (3 \times 4)(x^2 \times x^5) = 12x^7$.

::: booklet
**Not in the formula booklet:** the index laws. You must know them.
:::

### Worked example 1
Simplify $\dfrac{10x^6y^3}{2x^2y}$.
1. Numbers: $10 \div 2 = 5$.
2. $x$: $x^{6-2} = x^4$. $y$: $y^{3-1} = y^2$ (remember $y = y^1$).
3. Answer: $5x^4y^2$.

### Worked example 2: the bracket trap
Simplify $(2x^3)^2$.
- Every factor inside is squared: $2^2 \times (x^3)^2 = 4x^6$.

**The trap:** writing $2x^6$ (forgetting to square the $2$) or $4x^5$ (adding instead of multiplying the powers).

### Watch out
- $x^3 + x^2$ can't be simplified: the index laws are for multiplying and dividing, not adding.
- A letter on its own has power $1$.

notes: R`
### Single brackets
Multiply **every** term inside by the term outside: $3x(2x - 5) = 6x^2 - 15x$.

### Two brackets
Multiply each term in the first bracket by each term in the second:
> $$(a + b)(c + d) = ac + ad + bc + bd$$

Then collect like terms. For example $(x + 3)(x - 5) = x^2 - 5x + 3x - 15 = x^2 - 2x - 15$.

### Three brackets
Multiply two of them first, then multiply the answer by the third.

### Useful results
> $$(a + b)^2 = a^2 + 2ab + b^2 \qquad (a - b)^2 = a^2 - 2ab + b^2 \qquad (a + b)(a - b) = a^2 - b^2$$

::: booklet
**Not in the formula booklet:** these expansions. Learn them, especially the difference of two squares.
:::

### Worked example 1
Expand $(2x - 1)(x + 4)$.
1. $2x \cdot x + 2x \cdot 4 - 1 \cdot x - 1 \cdot 4 = 2x^2 + 8x - x - 4$
2. Collect: $2x^2 + 7x - 4$.

### Worked example 2: squaring a bracket
Expand $(x - 3)^2$.
- $(x - 3)(x - 3) = x^2 - 3x - 3x + 9 = x^2 - 6x + 9$

**The trap:** writing $x^2 - 9$ or $x^2 + 9$. Squaring a bracket always gives a middle term.

### Watch out
- Negative times negative is positive: $(-3)(-5) = +15$.
- When a minus sign is in front of a bracket, it changes every sign inside: $-(x - 4) = -x + 4$.

notes: R`
### What factorising means
Factorising is the reverse of expanding: write an expression as a product.
1. **Take out the highest common factor** first: $6x^2 + 9x = 3x(2x + 3)$.
2. Then look for a pattern.

### Quadratics $x^2 + bx + c$
Find two numbers that **multiply** to $c$ and **add** to $b$: $x^2 + 7x + 12 = (x + 3)(x + 4)$.

### Quadratics $ax^2 + bx + c$
Find two numbers that multiply to $ac$ and add to $b$, split the middle term, then factorise in pairs. For $2x^2 + 7x + 3$: $ac = 6$, numbers $6$ and $1$:
$2x^2 + 6x + x + 3 = 2x(x + 3) + 1(x + 3) = (2x + 1)(x + 3)$.

### Difference of two squares
> $$a^2 - b^2 = (a + b)(a - b)$$

For example $9x^2 - 25 = (3x + 5)(3x - 5)$.

::: booklet
**Not in the formula booklet:** any factorising methods.
:::

### Worked example 1
Factorise $x^2 - 2x - 15$: multiply to $-15$, add to $-2$: $-5$ and $3$. So $(x - 5)(x + 3)$.

### Worked example 2: factorise fully
Factorise fully $2x^3 - 18x$.
1. Common factor: $2x(x^2 - 9)$.
2. Difference of two squares: $2x(x + 3)(x - 3)$.

**The trap:** stopping at $2x(x^2 - 9)$. "Fully" means keep going until nothing more factorises.

### Watch out
- Always check by expanding your answer.
- $x^2 + 9$ does **not** factorise (it's a sum of squares).

notes: R`
### Negative and fractional indices
> $$a^0 = 1 \qquad a^{-m} = \frac{1}{a^m} \qquad a^{\frac1n} = \sqrt[n]{a} \qquad a^{\frac mn} = \left(\sqrt[n]{a}\right)^m$$

The same index laws as section 1.1 still apply.

### Working out $a^{\frac mn}$
Take the **root first**, then the power: the numbers stay small.
$27^{\frac23} = \left(\sqrt[3]{27}\right)^2 = 3^2 = 9$.

### Writing expressions as $ax^n$
This is vital for differentiation and integration later.
- $\dfrac{3}{x^2} = 3x^{-2}$
- $\sqrt x = x^{\frac12}$, and $\dfrac{1}{\sqrt x} = x^{-\frac12}$
- $\dfrac{x^2 + 4}{\sqrt x} = x^{\frac32} + 4x^{-\frac12}$ (split the fraction first)

::: booklet
**Not in the formula booklet:** the meaning of negative and fractional indices.
:::

### Worked example 1
Evaluate $\left(\dfrac{16}{81}\right)^{-\frac34}$.
1. Negative power: flip the fraction: $\left(\dfrac{81}{16}\right)^{\frac34}$.
2. Fourth root: $\dfrac{3}{2}$. Then cube: $\dfrac{27}{8}$.

### Worked example 2: where the coefficient goes
Write $\dfrac{1}{4x^3}$ in the form $ax^n$.
- $\dfrac{1}{4x^3} = \dfrac14 x^{-3}$

**The trap:** writing $4x^{-3}$. Only the $x^3$ moves up and becomes $x^{-3}$. The $4$ stays in the denominator as $\frac14$.

### Watch out
- $x^{-2}$ is not negative: it's $\dfrac{1}{x^2}$.
- $(2x)^{-1} = \dfrac{1}{2x}$, but $2x^{-1} = \dfrac{2}{x}$.
`,

CONTENT['P1.5'] = {
notes: R`
### Surds
A surd is a root that can't be written as a whole number or fraction, such as $\sqrt2$ or $\sqrt{12}$.
> $$\sqrt{ab} = \sqrt a\sqrt b \qquad \sqrt{\frac ab} = \frac{\sqrt a}{\sqrt b} \qquad \sqrt a \times \sqrt a = a$$

### Simplifying
Find the **largest square factor**: $\sqrt{72} = \sqrt{36 \times 2} = 6\sqrt2$.

### Adding and subtracting
Only like surds combine, just like algebra: $3\sqrt2 + 5\sqrt2 = 8\sqrt2$. Simplify each surd first: $\sqrt{50} + \sqrt{18} = 5\sqrt2 + 3\sqrt2 = 8\sqrt2$.

### Expanding brackets
Expand as normal, using $\sqrt a\sqrt a = a$:
$(2 + \sqrt3)(4 - \sqrt3) = 8 - 2\sqrt3 + 4\sqrt3 - 3 = 5 + 2\sqrt3$.

::: booklet
**Not in the formula booklet:** the surd rules. You'll need them on the non-calculator style questions.
:::

### Worked example 1
Simplify $\sqrt{48} - \sqrt{12}$: $4\sqrt3 - 2\sqrt3 = 2\sqrt3$.

### Worked example 2: roots don't split over addition
Is $\sqrt{9 + 16}$ equal to $\sqrt9 + \sqrt{16}$?
- $\sqrt{25} = 5$, but $3 + 4 = 7$. So no.

**The trap:** writing $\sqrt{a + b} = \sqrt a + \sqrt b$. Roots only split over **multiplication** and division.

### Watch out
- $(\sqrt5)^2 = 5$, and $(2\sqrt5)^2 = 4 \times 5 = 20$.
- Always look for the **largest** square factor, or you'll need to simplify twice.
`,

notes: R`
### Rationalising the denominator
"Rationalise" means removing surds from the bottom of a fraction.
- **One surd on the bottom:** multiply top and bottom by that surd.
$$\frac{6}{\sqrt3} = \frac{6\sqrt3}{3} = 2\sqrt3$$
- **A bracket like $a + \sqrt b$:** multiply top and bottom by the **conjugate** $a - \sqrt b$. The bottom becomes a difference of two squares, so the surd disappears.
$$\frac{1}{3 + \sqrt2} = \frac{3 - \sqrt2}{(3 + \sqrt2)(3 - \sqrt2)} = \frac{3 - \sqrt2}{7}$$

::: booklet
**Not in the formula booklet:** this method. Multiply by the conjugate, which is the same bracket with the sign in the middle flipped.
:::

### Worked example 1
Rationalise $\dfrac{4}{\sqrt5 - 1}$.
1. Multiply by $\dfrac{\sqrt5 + 1}{\sqrt5 + 1}$: the bottom is $5 - 1 = 4$.
2. $\dfrac{4(\sqrt5 + 1)}{4} = \sqrt5 + 1$.

### Worked example 2: multiply the whole numerator
Rationalise $\dfrac{2 + \sqrt3}{2 - \sqrt3}$.
1. Multiply top and bottom by $2 + \sqrt3$. Bottom: $4 - 3 = 1$.
2. Top: $(2 + \sqrt3)^2 = 4 + 4\sqrt3 + 3 = 7 + 4\sqrt3$.

**The trap:** multiplying only one term of the numerator by the conjugate. The **whole** numerator gets multiplied.

### Watch out
- Multiply top **and** bottom by the same thing, so the value doesn't change.
- Simplify at the end: cancel common factors.

CONTENT['7.1'] = {
notes: R`
### The big idea
You cannot split a trig function across a sum: $\sin(A+B) \ne \sin A + \sin B$. The **addition formulae** tell you what to do instead. They are in the formula booklet, but you need to use them quickly and get the signs right.

### Key formulae
> $$\sin(A \pm B) \equiv \sin A\cos B \pm \cos A\sin B$$
> $$\cos(A \pm B) \equiv \cos A\cos B \mp \sin A\sin B$$
> $$\tan(A \pm B) \equiv \frac{\tan A \pm \tan B}{1 \mp \tan A\tan B}$$

**Sign check:** in the $\cos$ formula the sign *flips*, so $\cos(A+B)$ has a minus in the middle. In the $\sin$ formula the sign stays the same.

### Exact values you must know
| $\theta$ | $30^\circ = \frac{\pi}{6}$ | $45^\circ = \frac{\pi}{4}$ | $60^\circ = \frac{\pi}{3}$ |
|---|---|---|---|
| $\sin\theta$ | $\frac12$ | $\frac{\sqrt2}{2}$ | $\frac{\sqrt3}{2}$ |
| $\cos\theta$ | $\frac{\sqrt3}{2}$ | $\frac{\sqrt2}{2}$ | $\frac12$ |
| $\tan\theta$ | $\frac{\sqrt3}{3}$ | $1$ | $\sqrt3$ |

Split awkward angles into these: $75^\circ = 45^\circ + 30^\circ$, $15^\circ = 45^\circ - 30^\circ$, $105^\circ = 60^\circ + 45^\circ$.

### Worked example
Find the exact value of $\cos 15^\circ$.
1. Write $15^\circ = 45^\circ - 30^\circ$.
2. Use the formula: $\cos(45^\circ - 30^\circ) = \cos45^\circ\cos30^\circ + \sin45^\circ\sin30^\circ$.
3. Substitute: $\frac{\sqrt2}{2}\cdot\frac{\sqrt3}{2} + \frac{\sqrt2}{2}\cdot\frac12 = \dfrac{\sqrt6+\sqrt2}{4}$.

### When you are given one ratio
If $\sin A = \frac35$, sketch a 3-4-5 right-angled triangle to read off $\cos A = \frac45$ and $\tan A = \frac34$. Then use the quadrant (CAST) to fix the sign. An **obtuse** angle has positive $\sin$ but negative $\cos$ and $\tan$.

::: booklet
**In the formula booklet:** all three addition formulae. **Not in the booklet, so learn them:** the exact values table above, and the CAST signs.
:::

### Worked example 2: watch the quadrant
Given $\sin A = \frac45$ with $A$ obtuse, and $\cos B = \frac{5}{13}$ with $B$ acute, find $\cos(A+B)$ exactly.
1. **$A$ is obtuse**, so $\cos A$ is negative: $\cos A = -\frac35$. **$B$ is acute**, so $\sin B = \frac{12}{13}$.
2. $\cos(A+B) = \cos A\cos B - \sin A\sin B = \left(-\frac35\right)\frac{5}{13} - \frac45\cdot\frac{12}{13} = -\frac{15}{65} - \frac{48}{65} = -\frac{63}{65}$

**The trap:** writing $\cos A = +\frac35$ because the triangle sides are positive. The triangle gives the size; the quadrant gives the sign.

### Watch out
- Using $\cos(A+B) = \cos A\cos B + \sin A\sin B$. The sign is wrong.
- Forgetting the sign of $\cos$ or $\sin$ for an obtuse or reflex angle.
- In "show that" questions, every line of working must be written. Jumping to the answer loses the A mark.
`,

/* 7.2 Using the angle addition formulae */
CONTENT['7.2'] = {
notes: R`
### What this section is about
You use the addition formulae in three ways:
1. **Forwards.** Expand something like $\sin(x + 30^\circ)$.
2. **Backwards.** Spot a pattern and collapse it, e.g. $\sin3x\cos x + \cos3x\sin x \equiv \sin4x$.
3. **In equations.** Expand, collect the $\sin$ terms and the $\cos$ terms, then divide by $\cos x$ to get a single $\tan x$.

### Recognising the reverse pattern
> $$\sin A\cos B + \cos A\sin B = \sin(A+B) \qquad \cos A\cos B + \sin A\sin B = \cos(A-B)$$

Example: $\cos 50^\circ\cos 10^\circ - \sin 50^\circ\sin 10^\circ = \cos 60^\circ = \frac12$.

### Worked example: solving an equation
Solve $\cos(x - 30^\circ) = 2\sin x$ for $0^\circ \le x < 360^\circ$.
1. Expand: $\cos x\cos30^\circ + \sin x\sin30^\circ = 2\sin x$, so $\frac{\sqrt3}{2}\cos x + \frac12\sin x = 2\sin x$.
2. Collect: $\frac{\sqrt3}{2}\cos x = \frac32\sin x$.
3. Divide by $\cos x$: $\tan x = \dfrac{\sqrt3}{3}$.
4. Solve: $x = 30^\circ$ or $x = 30^\circ + 180^\circ = 210^\circ$.

### Writing one tan in terms of another
If an equation has $x$ and $y$ in it, e.g. $\sin(x+y) = 2\cos(x-y)$, expand both sides and **divide every term by $\cos x\cos y$**. Every $\sin$ over $\cos$ becomes a $\tan$. Then make $\tan x$ the subject.

::: booklet
**In the formula booklet:** the addition formulae. You still need to recognise them in reverse, which the booklet doesn't help with.
:::

### Worked example 2: when the $\cos$ terms cancel
Solve $\sin(x + 60^\circ) = \sin(x + 120^\circ)$ for $0^\circ \le x < 360^\circ$.
1. Expand: $\frac12\sin x + \frac{\sqrt3}{2}\cos x = -\frac12\sin x + \frac{\sqrt3}{2}\cos x$.
2. The $\cos x$ terms cancel, leaving $\sin x = 0$.
3. So $x = 0^\circ$ or $180^\circ$.

**The trap:** rushing to "divide by $\cos x$ to get $\tan x$". Collect the terms first, and see what is actually left.

### Watch out
- Dividing by $\cos x$ is fine when solving for $\tan x$, but check that $\cos x = 0$ isn't a solution you've thrown away.
- $\tan$ repeats every $180^\circ$ ($\pi$ radians). List every solution in the interval.

{ id:'7.2-12', stars:4,
q: R`**(a)** Show that $3\sin(x + 60^\circ) - 2\cos(x + 30^\circ)$ can be written as $a\sin x + b\cos x$, giving the exact values of $a$ and $b$. [[4]]

**(b)** Hence solve, for $0^\circ \le x < 360^\circ$, $3\sin(x + 60^\circ) - 2\cos(x + 30^\circ) = 0$. Give your answers to 1 decimal place. [[3]]`,
hints: [
  R`Expand each bracket with exact values, then collect the $\sin x$ terms and the $\cos x$ terms.`,
  R`For (b): $a\sin x + b\cos x = 0$ means $\tan x = -\dfrac{b}{a}$.`,
  R`$\tan x$ is negative, so the solutions are in the second and fourth quadrants.`
],
scheme: [
  ['(a)', 'M1', R`Expands $3\sin(x + 60^\circ)$`],
  ['(a)', 'M1', R`Expands $2\cos(x + 30^\circ)$ and subtracts`],
  ['(a)', 'A1', R`$a = \frac52$`],

  ['(b)', 'M1', R`$\tan x = -\dfrac{\sqrt3}{5}$`],

2. $2\cos(x + 30^\circ) = 2\left(\frac{\sqrt3}{2}\cos x - \frac12\sin x\right) = \sqrt3\cos x - \sin x$
3. **Subtract:** $\left(\frac32 + 1\right)\sin x + \left(\frac{3\sqrt3}{2} - \sqrt3\right)\cos x = \frac52\sin x + \frac{\sqrt3}{2}\cos x$

So $a = \frac52$ and $b = \frac{\sqrt3}{2}$.

**(b)** $\frac52\sin x + \frac{\sqrt3}{2}\cos x = 0$, so $\tan x = -\dfrac{\sqrt3}{5}$.
$\tan^{-1}\left(\frac{\sqrt3}{5}\right) = 19.1^\circ$. $\tan$ is negative in the second and fourth quadrants: $x = 180^\circ - 19.1^\circ = 160.9^\circ$ and $x = 360^\circ - 19.1^\circ = 340.9^\circ$.`

{ id:'7.2-13', stars:4,
q: R`The angles $x$ and $y$ satisfy $\cos(x - y) = 3\cos(x + y)$.

**(a)** Show that $\tan x\tan y = \frac12$. [[4]]

**(b)** Given also that $\tan(x + y) = 3$, find the possible values of $\tan x$. [[4]]`,
hints: [
  R`Expand both sides, collect terms, then divide by $\cos x\cos y$.`,
  R`For (b): $\tan(x + y) = \dfrac{\tan x + \tan y}{1 - \tan x\tan y}$. You know the product is $\frac12$.`,
  R`You get $\tan x + \tan y = \frac32$ and $\tan x\tan y = \frac12$. Substitute $\tan y = \dfrac{1}{2\tan x}$ to get a quadratic.`
],
scheme: [
  ['(a)', 'M1', R`Expands both sides`],
  ['(a)', 'A1', R`$4\sin x\sin y = 2\cos x\cos y$`],
  ['(a)', 'M1', R`Divides by $\cos x\cos y$`],
  ['(a)', 'A1', R`$\tan x\tan y = \frac12$ (cso)`],
  ['(b)', 'M1', R`$\dfrac{\tan x + \tan y}{1 - \frac12} = 3$`],
  ['(b)', 'A1', R`$\tan x + \tan y = \frac32$`],
  ['(b)', 'M1', R`Forms a quadratic in $\tan x$`],
  ['(b)', 'A1', R`$\tan x = 1$ or $\tan x = \frac12$`]
],
answer: R`(b) $\tan x = 1$ or $\frac12$`,
sol: R`
**(a)**
1. **Expand:** $\cos x\cos y + \sin x\sin y = 3\cos x\cos y - 3\sin x\sin y$
2. **Collect:** $4\sin x\sin y = 2\cos x\cos y$
3. **Divide by $4\cos x\cos y$:** $\tan x\tan y = \frac12$ $\blacksquare$

**(b)**
1. $\tan(x + y) = \dfrac{\tan x + \tan y}{1 - \frac12} = 3$, so $\tan x + \tan y = \frac32$.
2. Let $t = \tan x$. Then $\tan y = \dfrac{1}{2t}$, so $t + \dfrac{1}{2t} = \dfrac32$.
3. Multiply by $2t$: $2t^2 - 3t + 1 = 0$, so $(2t - 1)(t - 1) = 0$.
4. $\tan x = 1$ or $\tan x = \frac12$. (They swap with $\tan y$: one is $1$, the other $\frac12$.)`
},
{ id:'7.2-14', stars:4,
q: R`The angles $A$ and $B$ satisfy $\sin(A + B) = \frac35$ and $\sin(A - B) = \frac13$.

**(a)** Find the exact values of $\sin A\cos B$ and $\cos A\sin B$. [[5]]

**(b)** Hence show that $\tan A = \frac72\tan B$. [[2]]`,
hints: [
  R`Expand both: $\sin A\cos B + \cos A\sin B = \frac35$ and $\sin A\cos B - \cos A\sin B = \frac13$.`,
  R`Treat $p = \sin A\cos B$ and $q = \cos A\sin B$ as unknowns in simultaneous equations.`,
  R`For (b), divide $p$ by $q$: $\dfrac{\sin A\cos B}{\cos A\sin B} = \dfrac{\tan A}{\tan B}$.`
],
scheme: [
  ['(a)', 'M1', R`Expands both equations`],
  ['(a)', 'A1', R`Both equations correct`],
  ['(a)', 'M1', R`Adds or subtracts to eliminate one product`],
  ['(a)', 'A1', R`$\sin A\cos B = \frac{7}{15}$`],
  ['(a)', 'A1', R`$\cos A\sin B = \frac{2}{15}$`],
  ['(b)', 'M1', R`Divides: $\dfrac{\sin A\cos B}{\cos A\sin B} = \dfrac{\tan A}{\tan B}$`],
  ['(b)', 'A1', R`$\tan A = \frac72\tan B$ (cso)`]
],
answer: R`(a) $\sin A\cos B = \frac{7}{15}$, $\cos A\sin B = \frac{2}{15}$`,
sol: R`
**(a)** Let $p = \sin A\cos B$ and $q = \cos A\sin B$.
1. $\sin(A + B) = p + q = \frac35$ and $\sin(A - B) = p - q = \frac13$.
2. **Add:** $2p = \frac35 + \frac13 = \frac{14}{15}$, so $p = \frac{7}{15}$.
3. **Subtract:** $2q = \frac35 - \frac13 = \frac{4}{15}$, so $q = \frac{2}{15}$.

**(b)** $\dfrac{p}{q} = \dfrac{\sin A\cos B}{\cos A\sin B} = \dfrac{\tan A}{\tan B}$, and $\dfrac{p}{q} = \dfrac{7/15}{2/15} = \dfrac72$. So $\tan A = \frac72\tan B$. $\blacksquare$`
},

sol: R`
**(a)** Let $t = \tan\theta$.
1. $\tan3\theta = \dfrac{\tan2\theta + t}{1 - t\tan2\theta}$ with $\tan2\theta = \dfrac{2t}{1 - t^2}$.
2. **Multiply top and bottom by $1 - t^2$:** $\dfrac{2t + t(1 - t^2)}{(1 - t^2) - 2t^2} = \dfrac{3t - t^3}{1 - 3t^2}$ $\blacksquare$

**(b)** With $\theta = 15^\circ$, $\tan3\theta = \tan45^\circ = 1$. So $3t - t^3 = 1 - 3t^2$, which rearranges to $t^3 - 3t^2 - 3t + 1 = 0$. $\blacksquare$

**(c)** $\tan3\theta = 1$ also for $3\theta = 225^\circ$ and $405^\circ$, i.e. $\theta = 75^\circ$ and $135^\circ$. So the roots are $\tan15^\circ$, $\tan75^\circ$ and $\tan135^\circ$.
Algebra check: $t = -1$ works ($-1 - 3 + 3 + 1 = 0$), and $t^3 - 3t^2 - 3t + 1 = (t + 1)(t^2 - 4t + 1)$. The quadratic gives $t = 2 \pm \sqrt3$.
- $2 - \sqrt3 = \tan15^\circ$ (the root from (b))
- $2 + \sqrt3 = \tan75^\circ$
- $-1 = \tan135^\circ$`
}
]
};

/* 7.3 Double-angle formulae */
CONTENT['7.3'] = {
notes: R`
### Where they come from
Put $B = A$ in the addition formulae. For example $\sin(A+A) = \sin A\cos A + \cos A\sin A = 2\sin A\cos A$.

### Key formulae
> $$\sin 2A \equiv 2\sin A\cos A$$
> $$\cos 2A \equiv \cos^2 A - \sin^2 A \equiv 2\cos^2 A - 1 \equiv 1 - 2\sin^2 A$$
> $$\tan 2A \equiv \frac{2\tan A}{1-\tan^2 A}$$

### Picking the right version of cos 2A
- The rest of the expression is in **$\cos$**: use $2\cos^2A - 1$.
- The rest is in **$\sin$**: use $1 - 2\sin^2 A$.
- You want to **remove a square**: rearrange to $\cos^2 A = \frac{1+\cos2A}{2}$ or $\sin^2A = \frac{1-\cos2A}{2}$.

### They work for any "double"
$\sin x = 2\sin\frac x2\cos\frac x2$, $\cos 4\theta = 1 - 2\sin^2 2\theta$, $\sin 6x = 2\sin3x\cos3x$.

### Half angles
Reading $\cos2A = 2\cos^2A - 1$ with $A = \frac x2$ gives exact values for half angles:
> $$\cos^2\frac x2 = \frac{1 + \cos x}{2} \qquad \sin^2\frac x2 = \frac{1 - \cos x}{2}$$

For example $\sin^2 22.5^\circ = \dfrac{1 - \cos45^\circ}{2} = \dfrac{2 - \sqrt2}{4}$. Take the square root with the sign from the quadrant.

### $\cos 2x$ in terms of $\tan x$
Dividing $\cos^2x - \sin^2x$ by $\cos^2x + \sin^2x\ (= 1)$ gives $\cos2x \equiv \dfrac{1 - \tan^2x}{1 + \tan^2x}$. This is useful when you only know $\tan x$.

::: booklet
**Not in the formula booklet:** the booklet lists the addition formulae but not the double-angle formulae. They come from the addition formulae with $B = A$, so learn them, including all three forms of $\cos2A$.
:::

### Worked example 1
Given $\tan x = \frac34$ and $x$ is acute, find $\sin 2x$, $\cos 2x$ and $\tan 2x$.
1. 3-4-5 triangle: $\sin x = \frac35$, $\cos x = \frac45$.
2. $\sin2x = 2\cdot\frac35\cdot\frac45 = \frac{24}{25}$
3. $\cos 2x = \cos^2x - \sin^2x = \frac{16}{25} - \frac9{25} = \frac{7}{25}$
4. $\tan 2x = \dfrac{24/25}{7/25} = \frac{24}{7}$

### Worked example 2: two negatives make a positive
Given $\sin x = -\frac13$ with $180^\circ < x < 270^\circ$, find $\sin 2x$ exactly.
1. Third quadrant, so $\cos x$ is negative too: $\cos x = -\sqrt{1 - \frac19} = -\frac{2\sqrt2}{3}$.
2. $\sin2x = 2\left(-\frac13\right)\left(-\frac{2\sqrt2}{3}\right) = \frac{4\sqrt2}{9}$

**The trap:** expecting a negative answer because $\sin x$ is negative. Here $2x$ is between $360^\circ$ and $540^\circ$, where $\sin$ is positive.

### Watch out
- $\sin 2A \ne 2\sin A$.
- Find the sign of $\sin x$ or $\cos x$ from the quadrant **before** you double it.
- $\cos^2 A$ means $(\cos A)^2$.
`,

  angles: [{ at: 'A', from: 'B', to: 'C', label: '2θ', r: 30 }], sides: [{ on: ['B', 'A'], label: '10 cm', off: 20 }, { on: ['A', 'C'], label: '10 cm', off: 20 }, { on: ['C', 'B'], label: 'b', off: 14 }], w: 320, h: 220 }),
q: R`The triangle $ABC$ has $AB = AC = 10$ cm and angle $BAC = 2\theta$, where $0^\circ < \theta < 90^\circ$.

**(a)** Show that the area of the triangle is $50\sin2\theta$ cm². [[2]]

**(b)** Show that the length of the base is $b = 20\sin\theta$ cm. [[2]]

**(c)** Given that $b = 12$ cm, find the exact area of the triangle. [[3]]`,
hints: [
  R`Area $= \frac12ab\sin C$.`,
  R`The line from $A$ to the midpoint of $BC$ bisects the angle $2\theta$, making two right-angled triangles with angle $\theta$ at $A$.`,
  R`For (c), $\sin\theta = \frac{12}{20} = \frac35$. Find $\cos\theta$, then $\sin2\theta$.`
],
scheme: [
  ['(a)', 'M1', R`$\frac12 \times 10 \times 10 \times \sin2\theta$`],
  ['(a)', 'A1', R`$50\sin2\theta$ (cso)`],
  ['(b)', 'M1', R`Half the base: $10\sin\theta$`],
  ['(b)', 'A1', R`$b = 20\sin\theta$ (cso)`],
  ['(c)', 'M1', R`$\sin\theta = \frac35$, $\cos\theta = \frac45$`],
  ['(c)', 'M1', R`$\sin2\theta = 2 \cdot \frac35 \cdot \frac45 = \frac{24}{25}$`],
  ['(c)', 'A1', R`Area $= 48$ cm²`]
],
answer: R`(c) $48$ cm²`,
sol: R`
**(a)** Area $= \frac12 \times AB \times AC \times \sin BAC = \frac12 \times 10 \times 10 \times \sin2\theta = 50\sin2\theta$ $\blacksquare$

**(b)** Drop a perpendicular from $A$ to the midpoint $M$ of $BC$. It bisects angle $A$, so angle $BAM = \theta$, and $BM = 10\sin\theta$. So $b = 2 \times 10\sin\theta = 20\sin\theta$. $\blacksquare$

**(c)** $20\sin\theta = 12$, so $\sin\theta = \frac35$ and $\cos\theta = \frac45$ (acute). Then $\sin2\theta = 2 \cdot \frac35 \cdot \frac45 = \frac{24}{25}$ and the area $= 50 \times \frac{24}{25} = 48$ cm².

Check: the height is $\sqrt{10^2 - 6^2} = 8$, and $\frac12 \times 12 \times 8 = 48$ ✓`
},
{ id:'7.3-15', stars:5,
q: R`Let $\theta = 18^\circ$.

**(a)** Explain why $\sin2\theta = \cos3\theta$. [[2]]

**(b)** Using $\cos3\theta \equiv 4\cos^3\theta - 3\cos\theta$, show that $4\sin^2\theta + 2\sin\theta - 1 = 0$. [[4]]

**(c)** Hence find the exact value of $\sin18^\circ$. [[2]]`,
hints: [
  R`$5\theta = 90^\circ$, so $2\theta = 90^\circ - 3\theta$. What is $\sin(90^\circ - x)$?`,
  R`Write $2\sin\theta\cos\theta = 4\cos^3\theta - 3\cos\theta$ and divide by $\cos\theta$ (why is that allowed?).`,
  R`Replace $\cos^2\theta$ with $1 - \sin^2\theta$, then solve the quadratic in $\sin\theta$. $\sin18^\circ > 0$.`
],
scheme: [
  ['(a)', 'M1', R`$5\theta = 90^\circ$, so $2\theta = 90^\circ - 3\theta$`],
  ['(a)', 'A1', R`$\sin2\theta = \sin(90^\circ - 3\theta) = \cos3\theta$`],
  ['(b)', 'M1', R`$2\sin\theta\cos\theta = 4\cos^3\theta - 3\cos\theta$`],
  ['(b)', 'M1', R`Divides by $\cos\theta$, stating $\cos18^\circ \ne 0$`],
  ['(b)', 'M1', R`Uses $\cos^2\theta = 1 - \sin^2\theta$`],
  ['(b)', 'A1', R`$4\sin^2\theta + 2\sin\theta - 1 = 0$ (cso)`],
  ['(c)', 'M1', R`Quadratic formula`],
  ['(c)', 'A1', R`$\sin18^\circ = \dfrac{\sqrt5 - 1}{4}$, rejecting the negative root`]
],
answer: R`$\sin18^\circ = \dfrac{\sqrt5 - 1}{4}$`,
sol: R`
**(a)** $5 \times 18^\circ = 90^\circ$, so $2\theta = 90^\circ - 3\theta$. Then $\sin2\theta = \sin(90^\circ - 3\theta) = \cos3\theta$.

**(b)**
1. $2\sin\theta\cos\theta = 4\cos^3\theta - 3\cos\theta$
2. $\cos18^\circ \ne 0$, so divide by $\cos\theta$: $2\sin\theta = 4\cos^2\theta - 3$
3. Replace $\cos^2\theta$: $2\sin\theta = 4(1 - \sin^2\theta) - 3 = 1 - 4\sin^2\theta$
4. Rearrange: $4\sin^2\theta + 2\sin\theta - 1 = 0$ $\blacksquare$

**(c)** $\sin\theta = \dfrac{-2 \pm \sqrt{4 + 16}}{8} = \dfrac{-1 \pm \sqrt5}{4}$. Since $\sin18^\circ > 0$, $\sin18^\circ = \dfrac{\sqrt5 - 1}{4}$ ($\approx 0.309$ ✓).`
}
]
};

/* 7.4 Solving trigonometric equations */
CONTENT['7.4'] = {
notes: R`
### The strategy
Turn the equation into one trig function of one angle, then solve it.

| The equation contains | Replace with |
|---|---|
| $\cos 2x$ and $\cos x$ | $\cos 2x = 2\cos^2x - 1$ |
| $\cos 2x$ and $\sin x$ | $\cos 2x = 1 - 2\sin^2x$ |
| $\sin 2x$ with $\sin x$ or $\cos x$ | $\sin 2x = 2\sin x\cos x$, then **factorise** |
| $\tan 2x$ and $\tan x$ | $\tan 2x = \frac{2\tan x}{1 - \tan^2x}$ |

You usually end up with a quadratic in $\sin x$ or $\cos x$, or a product equal to zero.

### Never divide by sin x or cos x
If $\sin x$ is a common factor, **factorise it out**. Dividing by it loses every solution where $\sin x = 0$.

### Multiple angles: change the interval
To solve $\sin 2x = \frac12$ for $0 \le x < 360^\circ$, solve for $2x$ on $0 \le 2x < 720^\circ$, then halve every answer.

### Mixing in sec, cosec and cot (Chapter 6)
Exam questions often combine double angles with the reciprocal functions. Rewrite everything in $\sin$ and $\cos$ first:
> $$\sec x = \frac{1}{\cos x} \qquad \text{cosec}\,x = \frac{1}{\sin x} \qquad \cot x = \frac{\cos x}{\sin x}$$

Then multiply through to clear the fractions, and **note the values you must exclude**: $\cot x$ and $\text{cosec}\,x$ don't exist where $\sin x = 0$, and $\sec x$ doesn't exist where $\cos x = 0$. The identities $1 + \tan^2x = \sec^2x$ and $1 + \cot^2x = \text{cosec}^2x$ are often useful too.

::: booklet
**Not in the formula booklet:** the double-angle formulae and the reciprocal identities. Learn them, and learn the solving strategy table above.
:::

### Worked example 1
Solve $\sin2x = \sin x$ for $0^\circ \le x \le 360^\circ$.
1. $2\sin x\cos x - \sin x = 0$
2. Factorise: $\sin x(2\cos x - 1) = 0$
3. $\sin x = 0$ gives $x = 0^\circ, 180^\circ, 360^\circ$.
4. $\cos x = \frac12$ gives $x = 60^\circ, 300^\circ$.

### Worked example 2: don't stop too early
Solve $\cos3x = \frac12$ for $0^\circ \le x < 180^\circ$.
1. The range for $3x$ is $0^\circ \le 3x < 540^\circ$.
2. $\cos^{-1}\frac12 = 60^\circ$, so $3x = 60^\circ,\ 300^\circ,\ 420^\circ$ (that's $360^\circ + 60^\circ$; the next, $660^\circ$, is too big).
3. Divide by $3$: $x = 20^\circ,\ 100^\circ,\ 140^\circ$.

**The trap:** stopping at $3x = 60^\circ, 300^\circ$ and missing $x = 140^\circ$. List every solution in the stretched interval before dividing.

### Watch out
- Reject impossible values with a reason, e.g. "$\sin x = -2$ has no solutions since $-1 \le \sin x \le 1$".
- Check whether the interval is in degrees or radians, and whether it is $<$ or $\le$.
- Give answers to the accuracy asked for (often 1 d.p. or 3 s.f.).
`,
questions: [
{ id:'7.4-1', stars:2,
q: R`Solve, for $0^\circ \le x < 360^\circ$, $\cos2x = 3\sin x - 1$. [[5]]`,
hints: [
  R`The rest of the equation is in $\sin x$, so use $\cos 2x = 1 - 2\sin^2x$.`,
  R`Rearrange to a quadratic in $\sin x$: $2\sin^2x + 3\sin x - 2 = 0$.`
],
scheme: [
  ['', 'M1', R`Uses $\cos 2x = 1 - 2\sin^2x$`],
  ['', 'A1', R`$2\sin^2x + 3\sin x - 2 = 0$`],
  ['', 'M1', R`Solves the quadratic: $(2\sin x - 1)(\sin x + 2) = 0$`],
  ['', 'A1', R`$\sin x = \frac12$ (rejects $\sin x = -2$)`],
  ['', 'A1', R`$x = 30^\circ, 150^\circ$`]
],
answer: R`$x = 30^\circ,\ 150^\circ$`,
sol: R`
1. Substitute: $1 - 2\sin^2 x = 3\sin x - 1$
2. Rearrange: $2\sin^2x + 3\sin x - 2 = 0$
3. Factorise: $(2\sin x - 1)(\sin x + 2) = 0$
4. $\sin x = \frac12$, or $\sin x = -2$, which has no solutions since $|\sin x| \le 1$.
5. $\sin x = \frac12$: $x = 30^\circ$ and $180^\circ - 30^\circ = 150^\circ$.`
},
{ id:'7.4-2', stars:3,

  R`You will get $\sin\theta(2\cos^2\theta - 1) = 0$.`
],
scheme: [
  ['', 'M1', R`$2\sin\theta\cos\theta = \dfrac{\sin\theta}{\cos\theta}$`],
  ['', 'M1', R`Multiplies by $\cos\theta$ and factorises out $\sin\theta$`],
  ['', 'A1', R`$\sin\theta(2\cos^2\theta - 1) = 0$`],
  ['', 'B1', R`$\theta = 0,\ \pi,\ 2\pi$`],
  ['', 'M1', R`$\cos\theta = \pm\frac{1}{\sqrt2}$`],
  ['', 'A1', R`$\theta = \frac\pi4,\ \frac{3\pi}4,\ \frac{5\pi}{4},\ \frac{7\pi}{4}$`]
],
answer: R`$\theta = 0,\ \frac\pi4,\ \frac{3\pi}4,\ \pi,\ \frac{5\pi}4,\ \frac{7\pi}4,\ 2\pi$`,
sol: R`
1. $2\sin\theta\cos\theta = \dfrac{\sin\theta}{\cos\theta}$
2. Multiply by $\cos\theta$: $2\sin\theta\cos^2\theta = \sin\theta$, so $2\sin\theta\cos^2\theta - \sin\theta = 0$.
3. Factorise: $\sin\theta(2\cos^2\theta - 1) = 0$
4. $\sin\theta = 0$ gives $\theta = 0, \pi, 2\pi$.
5. $\cos^2\theta = \frac12$, so $\cos\theta = \pm\frac{1}{\sqrt2}$, giving $\theta = \frac\pi4, \frac{3\pi}4, \frac{5\pi}4, \frac{7\pi}4$.

None of these make $\cos\theta = 0$, so $\tan\theta$ is defined at every one: seven solutions.`
},
{ id:'7.4-3', stars:3,
q: R`Solve, for $0^\circ \le x < 360^\circ$, $3\cos 2x + 5\cos x + 4 = 0$. Give non-exact answers to 1 decimal place. [[6]]`,
hints: [
  R`Use $\cos2x = 2\cos^2x - 1$, since everything else is in $\cos x$.`,
  R`You should get $6\cos^2x + 5\cos x + 1 = 0$, which factorises.`
],
scheme: [
  ['', 'M1', R`Uses $\cos 2x = 2\cos^2 x - 1$`],
  ['', 'A1', R`$6\cos^2x + 5\cos x + 1 = 0$`],
  ['', 'M1', R`Solves: $(3\cos x + 1)(2\cos x + 1) = 0$`],
  ['', 'A1', R`$\cos x = -\frac12$ and $\cos x = -\frac13$`],
  ['', 'A1', R`$x = 120^\circ, 240^\circ$`],
  ['', 'A1', R`$x = 109.5^\circ, 250.5^\circ$`]
],
answer: R`$x = 109.5^\circ,\ 120^\circ,\ 240^\circ,\ 250.5^\circ$`,
sol: R`
1. $3(2\cos^2x - 1) + 5\cos x + 4 = 0$, so $6\cos^2x + 5\cos x + 1 = 0$.
2. $(3\cos x + 1)(2\cos x + 1) = 0$, so $\cos x = -\frac13$ or $\cos x = -\frac12$.
3. $\cos x = -\frac12$: $x = 120^\circ$ and $360^\circ - 120^\circ = 240^\circ$.
4. $\cos x = -\frac13$: $x = \cos^{-1}\left(-\frac13\right) = 109.47\ldots^\circ$ and $360^\circ - 109.47^\circ = 250.53^\circ$, so $109.5^\circ$ and $250.5^\circ$ to 1 d.p.`
},
{ id:'7.4-4', stars:2,
q: R`Solve, for $0^\circ \le x < 180^\circ$, the equation $\sin x\cos x = \frac14$. [[4]]`,

  ['', 'M1', R`$\sin x\cos x = \frac12\sin2x$`],
  ['', 'A1', R`$\sin 2x = \frac12$`],

  ['', 'A1', R`$x = 15^\circ, 75^\circ$`]
],
answer: R`$x = 15^\circ,\ 75^\circ$`,
sol: R`
1. $\sin2x = 2\sin x\cos x$, so $\sin x\cos x = \frac12\sin2x$ and the equation becomes $\frac12\sin2x = \frac14$, i.e. $\sin2x = \frac12$.

3. $2x = 30^\circ$ or $180^\circ - 30^\circ = 150^\circ$.
4. Halve: $x = 15^\circ, 75^\circ$.`
},

{ id:'7.4-9', stars:2,
q: R`Solve, for $0^\circ \le x < 180^\circ$, $\tan2x = 3\tan x$. [[5]]`,

scheme: [
  ['', 'M1', R`Uses $\tan2x = \dfrac{2t}{1 - t^2}$`],
  ['', 'M1', R`Rearranges and factorises out $t$: $t(3t^2 - 1) = 0$`],
  ['', 'A1', R`$t = 0$ or $t = \pm\frac{1}{\sqrt3}$`],

answer: R`$x = 0^\circ, 30^\circ, 150^\circ$`,
sol: R`

{ id:'7.4-15', stars:5,
q: R`**(a)** Show that the equation $8\cos^3x - 6\cos x + 1 = 0$ can be written as $\cos3x = -\frac12$. You may use $\cos3x \equiv 4\cos^3x - 3\cos x$. [[2]]

**(b)** Hence solve $8\cos^3x - 6\cos x + 1 = 0$ for $0^\circ \le x \le 180^\circ$. [[3]]

**(c)** By considering the roots of the cubic $8c^3 - 6c + 1 = 0$, show that $\cos40^\circ + \cos80^\circ + \cos160^\circ = 0$. [[3]]`,
hints: [
  R`$8\cos^3x - 6\cos x = 2\cos3x$.`,
  R`For (b), $0^\circ \le 3x \le 540^\circ$. Find every $3x$ with $\cos3x = -\frac12$ in that range.`,
  R`For (c): the three answers to (b) give three different values of $c = \cos x$, so they are the three roots of the cubic. Write $8c^3 - 6c + 1 = 8(c - p)(c - q)(c - r)$ and compare the $c^2$ terms on each side.`
],
scheme: [
  ['(a)', 'M1', R`$8\cos^3x - 6\cos x = 2(4\cos^3x - 3\cos x) = 2\cos3x$`],
  ['(a)', 'A1', R`$2\cos3x + 1 = 0$, so $\cos3x = -\frac12$ (cso)`],
  ['(b)', 'M1', R`Uses $0^\circ \le 3x \le 540^\circ$`],
  ['(b)', 'A1', R`$3x = 120^\circ, 240^\circ, 480^\circ$`],
  ['(b)', 'A1', R`$x = 40^\circ, 80^\circ, 160^\circ$`],
  ['(c)', 'M1', R`States the roots of the cubic are $\cos40^\circ$, $\cos80^\circ$, $\cos160^\circ$ (three distinct values)`],

answer: R`(b) $x = 40^\circ, 80^\circ, 160^\circ$`,
sol: R`
**(a)** $8\cos^3x - 6\cos x = 2(4\cos^3x - 3\cos x) = 2\cos3x$. So the equation is $2\cos3x + 1 = 0$, i.e. $\cos3x = -\frac12$. $\blacksquare$

**(b)** $0^\circ \le x \le 180^\circ$ gives $0^\circ \le 3x \le 540^\circ$. $\cos3x = -\frac12$ at $3x = 120^\circ, 240^\circ, 480^\circ$ (the next is $600^\circ$, too big). So $x = 40^\circ, 80^\circ, 160^\circ$.

**(c)** Let $c = \cos x$. The cubic $8c^3 - 6c + 1 = 0$ has at most three roots, and (b) gives three different ones: $\cos40^\circ$, $\cos80^\circ$ and $\cos160^\circ$. So these **are** its roots.
So $8c^3 - 6c + 1 = 8(c - p)(c - q)(c - r)$ with $p, q, r$ these three values. Expanding the right side, the $c^2$ term is $-8(p + q + r)c^2$. The left side has no $c^2$ term, so $p + q + r = 0$:
$$\cos40^\circ + \cos80^\circ + \cos160^\circ = 0 \ \blacksquare$$
(Check: $0.7660 + 0.1736 - 0.9397 = -0.0001 \approx 0$ ✓)`
}

notes: R`
### Why bother?
An expression like $3\sin x + 4\cos x$ is awkward to solve or find a maximum of. Rewrite it as **one** trig function, $R\sin(x+\alpha)$, and it becomes easy.

### The four forms
> $$a\sin x \pm b\cos x = R\sin(x\pm\alpha) \qquad a\cos x \pm b\sin x = R\cos(x\mp\alpha)$$
> $$R = \sqrt{a^2+b^2}, \qquad \tan\alpha = \frac{b}{a}$$

Use the form the question asks for, and check the sign carefully.

### Method (show this in the exam)
For $3\sin x + 4\cos x = R\sin(x+\alpha)$:
1. Expand: $R\sin(x+\alpha) = R\sin x\cos\alpha + R\cos x\sin\alpha$
2. Compare coefficients: $R\cos\alpha = 3$ and $R\sin\alpha = 4$.
3. Square and add: $R^2 = 3^2 + 4^2$, so $R = 5$.
4. Divide: $\tan\alpha = \frac43$, so $\alpha = 53.13^\circ$.

### Max and min
Since $-1 \le \sin(x+\alpha) \le 1$:
- maximum of $R\sin(x+\alpha)$ is $R$, when $x + \alpha = 90^\circ$
- minimum is $-R$, when $x + \alpha = 270^\circ$

For $\dfrac{1}{k + R\sin(x+\alpha)}$, the **maximum** happens when the denominator is smallest.

### Solving $a\sin x + b\cos x = c$
Write it as $R\sin(x+\alpha) = c$. Then solve for $x + \alpha$ on the **shifted interval** $\alpha \le x+\alpha < 360^\circ + \alpha$, and subtract $\alpha$.

### As a transformation
$R\sin(x + \alpha)$ is the graph of $y = \sin x$ **translated $\alpha$ to the left** and then **stretched vertically by scale factor $R$**. So $3\sin x + 4\cos x$ has the shape of a sine wave with amplitude $5$:

[[fig:7.5-graph]]

Each crossing with a horizontal line $y = k$ is a solution of $3\sin x + 4\cos x = k$. If $|k| > R$ the line misses the curve completely, so there are **no solutions**.

::: booklet
**Not in the formula booklet:** $R = \sqrt{a^2 + b^2}$ and the method. You need the addition formulae (which are in the booklet) to expand $R\sin(x \pm \alpha)$ or $R\cos(x \pm \alpha)$, then compare coefficients.
:::

### Worked example 2: choosing the right form
Write $3\cos x - 4\sin x$ in the form $R\cos(x + \alpha)$ with $0 < \alpha < 90^\circ$.
1. $R\cos(x + \alpha) = R\cos x\cos\alpha - R\sin x\sin\alpha$
2. Compare: $R\cos\alpha = 3$ and $R\sin\alpha = 4$ (the minus sign is already in the expansion).
3. $R = 5$ and $\tan\alpha = \frac43$, so $3\cos x - 4\sin x = 5\cos(x + 53.13^\circ)$.

**The trap:** using $R\cos(x - \alpha)$ here gives $R\sin\alpha = -4$, which makes $\alpha$ negative. Pick the form whose expansion has the **same signs** as the expression.

### Watch out
- $\tan\alpha = \frac ba$ is $\frac{\sin\text{ coefficient}}{\cos\text{ coefficient}}$ from your comparison. Don't guess it. Write out $R\cos\alpha = \ldots$ and $R\sin\alpha = \ldots$.
- Keep $\alpha$ to at least 2 d.p. (or 4 s.f. in radians) during working.
`,

3. $\sqrt{1 + p^2} \ge 2$ gives $1 + p^2 \ge 4$, so $p^2 \ge 3$.

/* 7.6 Proving trigonometric identities */
CONTENT['7.6'] = {
notes: R`
### How to set out a proof
- Start from **one side**, usually the more complicated one, and work until you reach the other side.
- Write $\text{LHS} = \ldots = \ldots = \text{RHS}$. Do not work on both sides at once, and do not start by assuming the identity is true.
- Finish with a statement or $\blacksquare$.

### Toolkit
> $$\sin^2\theta + \cos^2\theta \equiv 1 \qquad 1 + \tan^2\theta \equiv \sec^2\theta \qquad 1 + \cot^2\theta \equiv \text{cosec}^2\theta$$
> $$\sin2\theta \equiv 2\sin\theta\cos\theta \qquad \cos2\theta \equiv \cos^2\theta - \sin^2\theta \equiv 2\cos^2\theta - 1 \equiv 1 - 2\sin^2\theta$$

Plus the addition formulae and $\sec\theta = \frac1{\cos\theta}$, $\text{cosec}\,\theta = \frac{1}{\sin\theta}$, $\cot\theta = \frac{\cos\theta}{\sin\theta}$.

### Moves that usually work
1. Write everything in terms of $\sin$ and $\cos$.
2. Combine fractions into a single fraction.
3. Look for $1 \pm \cos2\theta$, which simplifies to $2\cos^2\theta$ or $2\sin^2\theta$.
4. Look for a difference of two squares: $\cos^2 A - \sin^2 A = (\cos A - \sin A)(\cos A + \sin A)$.

### Disproving a false identity
To show a statement is **not** an identity, one counter-example is enough. Pick a value, work out both sides, and show they're different. Say clearly: "so the statement is false".

### Proof questions with "hence"
Many questions ask you to prove an identity, then use it: "Hence solve ...". Replace the complicated expression with the simpler side, solve, then **check** your solutions don't make the original expression undefined (a zero denominator, for example).

::: booklet
**In the formula booklet:** the addition formulae. **Not in the booklet:** $\sin^2 + \cos^2 = 1$, $1 + \tan^2 = \sec^2$, $1 + \cot^2 = \text{cosec}^2$ and the double-angle formulae. Learn these.
:::

### Worked example 1
Prove $\dfrac{1+\cos2x}{\sin2x} \equiv \cot x$.
$$\text{LHS} = \frac{1 + (2\cos^2x - 1)}{2\sin x\cos x} = \frac{2\cos^2 x}{2\sin x\cos x} = \frac{\cos x}{\sin x} = \cot x = \text{RHS}$$

### Worked example 2: don't work on both sides
Prove $\sec^2x + \text{cosec}^2x \equiv \sec^2x\,\text{cosec}^2x$.
$$\text{LHS} = \frac{1}{\cos^2x} + \frac{1}{\sin^2x} = \frac{\sin^2x + \cos^2x}{\cos^2x\sin^2x} = \frac{1}{\cos^2x\sin^2x} = \sec^2x\,\text{cosec}^2x = \text{RHS}\ \blacksquare$$

**The trap:** writing "$\sec^2x + \text{cosec}^2x = \sec^2x\,\text{cosec}^2x$" as your first line and then changing both sides. That assumes what you're trying to prove, and loses the marks.

### Watch out
- Each line must follow from the one before. Examiners withhold the final A mark (cso) if any step is missing or wrong.
`,

q: R`A student tries to prove that $\dfrac{\sin2\theta}{1 - \cos2\theta} \equiv \cot\theta$. Their working is:

notes: R`
### Real things that repeat
Tides, Ferris wheels, daily temperatures and pendulums all go up and down regularly. They are modelled with functions like
> $$y = a + b\sin(\omega t + \varepsilon) \qquad\text{or}\qquad y = a + R\cos(\omega t - \alpha)$$

### Reading the model
| Feature | How to find it |
|---|---|
| Middle (mean) value | $a$ |
| Amplitude | $b$ or $R$ |
| Maximum / minimum | $a + R$ and $a - R$ |
| Period | $\frac{360^\circ}{\omega}$ (degrees) or $\frac{2\pi}{\omega}$ (radians) |

If the model is written as $a + p\cos\omega t + q\sin\omega t$, first write it as $a + R\cos(\omega t - \alpha)$ (section 7.5).

[[fig:7.7-tide]]

### Building a model from data
If you know the maximum, the minimum and the time for one cycle:
- $a = \dfrac{\max + \min}{2}$ (the middle value)
- amplitude $= \dfrac{\max - \min}{2}$
- $\omega = \dfrac{360^\circ}{\text{period}}$

**Tides** around the UK repeat about every $12.4$ hours, so $\omega = \frac{360}{12.4} \approx 29.0$, not $30$.

### What does $\alpha$ mean?
In $a + R\sin(\omega t + \alpha)$, $\alpha$ shifts the graph sideways: it moves the time of the first maximum. A maximum happens when $\omega t + \alpha = 90^\circ$, so the first one is at $t = \dfrac{90 - \alpha}{\omega}$.

### Thresholds over several cycles
"For how long is the depth above $7$ m in a day?" Solve for **every** time in the interval, then add up the time spent above the line in each cycle. A sketch like the one above stops you missing a cycle.

::: booklet
**Not in the formula booklet:** anything specific to modelling. You need the $R$ form (section 7.5) and solving equations (section 7.4).
:::

### Worked example 1
The height of a Ferris wheel seat is $h = 12 - 10\cos(18t)^\circ$ metres, $t$ minutes after boarding.
- Lowest height: $12 - 10 = 2$ m, at $t = 0$.
- Highest height: $12 + 10 = 22$ m, when $18t = 180$, i.e. $t = 10$ minutes.
- Period: $\frac{360}{18} = 20$ minutes for one full turn.

### Worked example 2: minutes are not decimals
Using the same Ferris wheel, $h = 12 - 10\cos(18t)^\circ$: when is the seat first $17$ m high?
1. $12 - 10\cos(18t) = 17$, so $\cos(18t) = -\frac12$.
2. $18t = 120^\circ$, so $t = 6.67$ minutes.
3. $0.67$ of a minute is $0.667 \times 60 = 40$ seconds, so the answer is **6 minutes 40 seconds**.

**The trap:** writing "6 minutes 67 seconds". Convert the decimal part by multiplying by $60$. Also check your calculator is in **degrees** when the model uses $^\circ$.

### Answering in context
- Turn values of $t$ into real times ("$t = 5.21$ h" means 05:13).
- Include units.
- Typical **limitations**: the real pattern changes over time (weather, seasons), the amplitude may not stay constant, or the model ignores other factors.
`,

q: R`A student models the depth of water, $D$ metres, at a harbour with $D = 5 + 2\sin(30t)^\circ$, where $t$ is hours after midnight. Records show that high tides actually happen every $12.4$ hours.

scheme: [

CONTENT['5.1'] = {
notes: R`
### Splitting a force into components
A force $F$ at angle $\theta$ to a direction has
> $$\text{component along that direction} = F\cos\theta \qquad \text{component perpendicular} = F\sin\theta$$

[[fig:5.1-components]]

The component **next to** the angle gets $\cos$. If you are unsure, sketch the right-angled triangle.

### Resultant of several forces
1. Resolve every force horizontally ($\rightarrow$) and vertically ($\uparrow$).
2. Add the components: total $X$ and total $Y$.
3. Magnitude $= \sqrt{X^2 + Y^2}$. Direction $= \tan^{-1}\left(\frac{Y}{X}\right)$, measured from the positive $x$-direction. Always sketch it: if $X$ is negative the resultant points left, and the calculator's angle needs adjusting.

In vector form, a force of $F$ at $\theta$ above $\mathbf i$ is $(F\cos\theta)\mathbf i + (F\sin\theta)\mathbf j$. To add forces in $\mathbf i$, $\mathbf j$ form, add the $\mathbf i$ parts and the $\mathbf j$ parts separately.

### Equilibrium
A particle in equilibrium is at rest or moving at constant velocity. The resultant is zero, so
> $$\text{Resolving } (\rightarrow):\ \text{sum} = 0 \qquad \text{Resolving } (\uparrow):\ \text{sum} = 0$$

In vector form: the forces add up to $0\mathbf i + 0\mathbf j$.

### Moving particles
Resolve in the **direction of motion** and use $F = ma$. Resolve **perpendicular to the motion** with total $0$ (there's no acceleration that way), which usually gives the normal reaction $R$.

::: booklet
**Not in the formula booklet, so learn these:** $F\cos\theta$ and $F\sin\theta$ for components, $|\mathbf F| = \sqrt{X^2+Y^2}$, and $F = ma$ in each direction. The value $g = 9.8$ m s$^{-2}$ is given in the instructions on the front of each paper.
:::

### Worked example 1
A crate of mass $8$ kg rests on smooth horizontal ground. A rope pulls it with tension $40$ N at $30^\circ$ above the horizontal.

[[fig:5.1-crate]]

- $(\rightarrow)$, $F = ma$: $40\cos30^\circ = 8a$, so $a = 4.33$ m s$^{-2}$.
- $(\uparrow)$: $R + 40\sin30^\circ = 8g$, so $R = 78.4 - 20 = 58.4$ N.

### Worked example 2: the angle is given from the vertical
A particle hangs on a light string. A horizontal force of $5$ N holds it in equilibrium with the string at $20^\circ$ to the **vertical**. Find the tension and the mass.

[[fig:5.1-vertical]]

**The trap:** the angle is measured from the vertical, so the vertical part of $T$ is $T\cos20^\circ$, not $T\sin20^\circ$.
- $(\rightarrow)$: $T\sin20^\circ = 5$, so $T = 14.6$ N.
- $(\uparrow)$: $T\cos20^\circ = mg$, so $m = \dfrac{14.62\cos20^\circ}{9.8} = 1.40$ kg.

### Watch out
- Use $g = 9.8$ m s$^{-2}$. When your answer uses $g = 9.8$, give it to 2 or 3 significant figures.
- Write "Resolving $(\rightarrow)$" or "R($\uparrow$)" before each equation. Examiners look for it.
- Check which line each angle is measured from before choosing $\sin$ or $\cos$.
`,

  ['', 'A1', R`$T_1\cos30^\circ = T_2\cos60^\circ$`],

  ['', 'A1', R`$T_1\sin30^\circ + T_2\sin60^\circ = 4g$`],

answer: R`$T_1 = 19.6$ N, $T_2 = 33.9$ N`,
sol: R`

{ id:'5.1-11', stars:3,

q: R`A particle of weight $12$ N is held in equilibrium by a horizontal string with tension $5$ N and a force $P$ N acting at an angle $\theta$ above the horizontal, as shown. Find $P$ and $\theta$. [[6]]`,
hints: [

  R`$P\cos\theta = 5$ and $P\sin\theta = 12$.`,
  R`Divide to get $\tan\theta$, or square and add to get $P$.`

scheme: [
  ['', 'M1', R`Resolves horizontally`],
  ['', 'A1', R`$P\cos\theta = 5$`],
  ['', 'M1', R`Resolves vertically`],

answer: R`$P = 13$ N, $\theta = 67.4^\circ$`,

{ id:'5.1-12', stars:4,
