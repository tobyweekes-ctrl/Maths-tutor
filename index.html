notes: R`
### Choose sensible axes
On a slope, resolve **parallel** to the plane and **perpendicular** to it, not horizontally and vertically. Then the normal reaction and any motion each lie along one axis.

### Weight on a slope at angle $\alpha$
> $$\text{down the slope: } mg\sin\alpha \qquad \text{into the slope: } mg\cos\alpha$$

[[fig:5.2-weight]]

With no other perpendicular forces, $R = mg\cos\alpha$.

### Forces that aren't parallel to the slope
A **horizontal** force $P$ on a slope at angle $\alpha$ has
- a component $P\cos\alpha$ **up the slope**
- a component $P\sin\alpha$ **into the slope**, which increases $R$

A force $P$ at angle $\beta$ **above the slope** has $P\cos\beta$ up the slope and $P\sin\beta$ **away from** the slope, which decreases $R$.

### Exact ratios for special slopes
Exam questions often give $\tan\alpha$ as a fraction. Use the right-angled triangle, and keep the exact values instead of a rounded angle.

| $\tan\alpha$ | $\frac34$ | $\frac{5}{12}$ | $\frac{7}{24}$ |
|---|---|---|---|
| $\sin\alpha$ | $\frac35$ | $\frac{5}{13}$ | $\frac{7}{25}$ |
| $\cos\alpha$ | $\frac45$ | $\frac{12}{13}$ | $\frac{24}{25}$ |

### Moving on a smooth slope
With only the weight along the slope, the acceleration is $g\sin\alpha$, down the slope, whichever way the particle is moving. A particle projected **up** the slope decelerates at $g\sin\alpha$, stops, then slides back. Use the suvat equations along the slope.

::: booklet
**In the formula booklet:** the suvat equations. **Learn:** $mg\sin\alpha$ along and $mg\cos\alpha$ into the slope, and that $R$ is found by resolving perpendicular to the slope.
:::

### Worked example 1
A $2$ kg particle slides down a smooth plane inclined at $\alpha$, where $\tan\alpha = \frac{5}{12}$.

[[fig:5.2-ex1]]

- From the table, $\sin\alpha = \frac{5}{13}$ and $\cos\alpha = \frac{12}{13}$.
- Parallel, $F = ma$: $2g\cdot\frac5{13} = 2a$, so $a = 3.77$ m s$^{-2}$.
- Perpendicular: $R = 2g\cdot\frac{12}{13} = 18.1$ N.

### Worked example 2: R is not always $mg\cos\alpha$
A $3$ kg particle is held at rest on a smooth plane inclined at $30^\circ$ by a horizontal force $P$.

[[fig:5.2-ex2]]

- Parallel: $P\cos30^\circ = 3g\sin30^\circ$, so $P = 3g\tan30^\circ = 17.0$ N.
- Perpendicular: $R = 3g\cos30^\circ + P\sin30^\circ = 25.46 + 8.49 = 33.9$ N.

**The trap:** writing $R = 3g\cos30^\circ = 25.5$ N. The horizontal force also pushes into the slope.

### Watch out
- Smooth means no friction.
- Draw a clear force diagram first, with the weight acting vertically down.
- The angle between the weight and the "into the plane" direction equals the slope angle $\alpha$.
`,

q: R`A particle of mass $m$ is held in equilibrium on a smooth plane inclined at $\alpha$ to the horizontal by a force $P$ acting at an angle $\theta$ above the line of greatest slope, where $0 \le \theta < 90^\circ$.

**(a)** Show that $P = \dfrac{mg\sin\alpha}{\cos\theta}$ and $R = mg(\cos\alpha - \sin\alpha\tan\theta)$. [[4]]

**(b)** Find, in terms of $m$, $g$ and $\alpha$, the least possible value of $P$, and state its direction. [[2]]

**(c)** Find the range of values of $\theta$ for which the particle stays in contact with the plane. Give your answer in terms of $\alpha$. [[3]]`,
hints: [
  R`Resolve parallel: $P\cos\theta = mg\sin\alpha$. Resolve perpendicular: $R + P\sin\theta = mg\cos\alpha$.`,
  R`$P$ is least when $\cos\theta$ is greatest.`,
  R`Contact needs $R > 0$. Use $\dfrac{\cos\alpha}{\sin\alpha} = \tan(90^\circ - \alpha)$.`
],
scheme: [
  ['(a)', 'M1', R`Resolves parallel to the plane`],
  ['(a)', 'A1', R`$P = \dfrac{mg\sin\alpha}{\cos\theta}$`],
  ['(a)', 'M1', R`Resolves perpendicular and substitutes $P$`],
  ['(a)', 'A1', R`$R = mg(\cos\alpha - \sin\alpha\tan\theta)$ (cso)`],
  ['(b)', 'M1', R`$\cos\theta$ is greatest when $\theta = 0$`],
  ['(b)', 'A1', R`Least $P = mg\sin\alpha$, acting up the line of greatest slope`],
  ['(c)', 'M1', R`Requires $R > 0$`],
  ['(c)', 'M1', R`$\tan\theta < \dfrac{\cos\alpha}{\sin\alpha} = \tan(90^\circ - \alpha)$`],
  ['(c)', 'A1', R`$0 \le \theta < 90^\circ - \alpha$`]
],
answer: R`(b) $mg\sin\alpha$, parallel to the plane (c) $0 \le \theta < 90^\circ - \alpha$`,
sol: R`
**(a)**
1. **Parallel:** $P\cos\theta = mg\sin\alpha$, so $P = \dfrac{mg\sin\alpha}{\cos\theta}$.
2. **Perpendicular:** $R + P\sin\theta = mg\cos\alpha$, so $R = mg\cos\alpha - \dfrac{mg\sin\alpha}{\cos\theta}\sin\theta = mg(\cos\alpha - \sin\alpha\tan\theta)$.

**(b)** $P = \dfrac{mg\sin\alpha}{\cos\theta}$ is least when $\cos\theta$ is as large as possible, which is $1$ at $\theta = 0$. So the least force is $mg\sin\alpha$, pushing straight up the line of greatest slope.

**(c)** In contact means $R > 0$: $\cos\alpha > \sin\alpha\tan\theta$, so $\tan\theta < \dfrac{\cos\alpha}{\sin\alpha} = \tan(90^\circ - \alpha)$.
$\tan$ is increasing on $0 \le \theta < 90^\circ$, so $0 \le \theta < 90^\circ - \alpha$.

**Check:** at $\theta = 90^\circ - \alpha$ the force is vertical, and it would have to hold up the whole weight, so $R = 0$. Any steeper and it lifts the particle off.`

CONTENT['5.3'] = {
notes: R`
### The friction model
> $$F \le \mu R$$
- $F$ is the friction force, $R$ the normal reaction and $\mu$ the coefficient of friction.
- Friction **opposes motion**, or the motion that *would* happen.
- It only grows as large as it needs to be, up to a maximum of $\mu R$.

[[fig:5.3-ground]]

### Three situations
| Situation | Friction |
|---|---|
| At rest, not about to move | $F < \mu R$ (find $F$ by resolving) |
| On the point of moving (**limiting equilibrium**) | $F = \mu R$ |
| Moving | $F = \mu R$, opposite to the motion |

### Method
1. Draw a force diagram with friction in the right direction.
2. Resolve perpendicular to the surface to find $R$.
3. Use $F = \mu R$ if limiting or moving.
4. Resolve along the surface: equilibrium ($=0$) or $F = ma$.

### On a slope
- Particle about to slide **down**: friction acts **up** the slope.
- Being pushed and about to move **up**: friction acts **down** the slope.
- A particle on the point of slipping with no other forces: $\mu = \tan\alpha$.

[[fig:5.3-down]]

[[fig:5.3-up]]

### Range of values for equilibrium
When a force $P$ holds a particle on a rough slope, there is a range of $P$ that works.
- **Smallest $P$:** the particle is about to slide **down**, so friction $\mu R$ acts **up** the slope.
- **Largest $P$:** the particle is about to move **up**, so friction $\mu R$ acts **down** the slope.

Work out each case separately; the answer is $P_{\min} \le P \le P_{\max}$.

### Projected up a rough slope
On the way up, gravity **and** friction both act down the slope: $a = g\sin\alpha + \mu g\cos\alpha$ (deceleration).
When it stops, compare $\mu$ with $\tan\alpha$:
- $\mu \ge \tan\alpha$: friction can hold it, so it **stays at rest**.
- $\mu < \tan\alpha$: it **slides back down**, now with friction acting up the slope: $a = g\sin\alpha - \mu g\cos\alpha$.

### Connected particles over a pulley
Write $F = ma$ for **each** particle separately, in its own direction of motion, then add the equations to remove $T$. Both particles have the same size of acceleration because the string is inextensible.

[[fig:5.3-pulley]]

### Modelling assumptions (often worth a mark)
| Assumption | What it means for the working |
|---|---|
| **Particle** | Its size doesn't matter; all forces act at one point and it doesn't rotate |
| **Light** string | The tension is the same all along the string |
| **Inextensible** string | Connected particles have the same speed and acceleration |
| **Smooth** pulley | The tension is the same on both sides of the pulley |
| **Rough** surface | Friction acts, $F \le \mu R$ |

::: booklet
**Not in the formula booklet, so learn it:** $F \le \mu R$, with $F = \mu R$ when limiting or moving. The suvat equations are in the booklet.
:::

### Does it move?
Compare the force trying to move it with the **maximum** friction $\mu R$. If the driving force is greater, it moves. Otherwise it stays at rest, and friction equals the driving force.

### Worked example 1
A $10$ kg box on rough ground, $\mu = 0.3$, is pulled by a horizontal force of $40$ N. $R = 98$ N, so $F_{\max} = 29.4$ N. Since $40 > 29.4$ it moves, and $40 - 29.4 = 10a$ gives $a = 1.06$ m s$^{-2}$.

### Worked example 2: friction isn't always $\mu R$
A $2$ kg block rests on a rough slope at $20^\circ$, with $\mu = 0.5$. Find the friction force.

[[fig:5.3-ex2]]

- Weight down the slope: $2g\sin20^\circ = 6.70$ N.
- Maximum friction: $\mu R = 0.5 \times 2g\cos20^\circ = 9.21$ N.
- $6.70 < 9.21$, so the block stays at rest and friction is only what's needed: $F = 6.70$ N, up the slope.

**The trap:** answering $F = 9.21$ N. That's the *maximum* friction, used only when the block is limiting or moving.

### Watch out
- $R$ is **not** always $mg$. A pull at an angle or a slope changes it.
- "Rough" means friction acts. "Smooth" means it doesn't.
`,

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];

if (window.marked){
  marked.use({ gfm:true, breaks:false, renderer:{ html(t){ return esc(typeof t === 'string' ? t : (t && t.text) || ''); } } });
}
function tex(m){
  let display = false, t = m;
  if (m.startsWith('$$')){ display = true; t = m.slice(2, -2); }
  else if (m.startsWith('\\[')){ display = true; t = m.slice(2, -2); }
  else if (m.startsWith('\\(')) t = m.slice(2, -2);
  else t = m.slice(1, -1);
  if (!window.katex) return esc(m);
  try { return katex.renderToString(t.trim(), { displayMode: display, throwOnError: false, strict: 'ignore', output: 'html' }); }
  catch(e){ return esc(m); }
}
function md(src){
  const maths = [];
  let s = String(src || '').replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$(?!\s)[^$\n]+?\$/g, m => { maths.push(m); return 'MATHPH' + (maths.length-1) + 'Z'; });
  s = s.replace(/\[\[(\d+)\]\]/g, 'MKPH$1Z');
  const figs = [];
  s = s.replace(/\[\[fig:([\w.-]+)\]\]/g, (_, k) => { figs.push(FIGS[k] || ''); return '\n\nFIGPH' + (figs.length-1) + 'Z\n\n'; });
  const mdParse = t => window.marked ? marked.parse(t) : '<p>' + esc(t).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>') + '</p>';
  const boxes = [];
  s = s.replace(/^::: ?booklet\n([\s\S]*?)\n:::$/gm, (_, inner) => { boxes.push(mdParse(inner)); return '\n\nBOXPH' + (boxes.length-1) + 'Z\n\n'; });
  let html = mdParse(s);
  html = html.replace(/<p>BOXPH(\d+)Z<\/p>/g, (_, i) => '<div class="booklet">' + boxes[+i] + '</div>');
  html = html.replace(/MKPH(\d+)Z/g, '<span class="mk">($1)</span>');
  html = html.replace(/MATHPH(\d+)Z/g, (_, i) => tex(maths[+i]));
  html = html.replace(/<p>FIGPH(\d+)Z<\/p>|FIGPH(\d+)Z/g, (_, a, b) => figs[+(a ?? b)]);
  return html;
}
function setMD(el, src){ el.innerHTML = md(src); }
const plainQ = s => String(s).replace(/\[\[(\d+)\]\]/g, '($1)');
const starsOf = q => Math.min(5, Math.max(1, Math.round(q.stars || 3)));
const starsHTML = n => `<span class="stars" role="img" aria-label="Difficulty ${n} of 5">${'★'.repeat(n)}<span class="off">${'★'.repeat(5 - n)}</span></span>`;
const STAR_RUBRIC = [
  'One technique, one or two steps, recall (1–3 marks)',
  'Standard textbook exercise, routine method (3–5 marks)',
  'Typical exam question: several parts and one trap (5–8 marks)',
  'Harder exam question: a "hence" chain, an unfamiliar context, or a mix of sections (7–10 marks)',
  'Stretch: needs insight, links chapters, a proof or error-spotting, or an unusual twist (8–12 marks)'
];

function questionsFor(id){
  if (SECTIONS[id]) return SECTIONS[id].questions.concat(saved.gen[id] || []);
  const ch = CHAPTERS.find(c => c.id === id);
  return ch ? ch.sections.flatMap(s => s.questions.concat(saved.gen[s.id] || [])) : [];
}
function progress(qs){
  let got = 0, tot = 0, done = 0;
  qs.forEach(q => { tot += marksOf(q); const s = saved.scores[q.id]; if (s){ got += s.got; done++; } });
  return { got, tot, done };
}

function errText(e){
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled'){ aiBlocked = true; refreshAI(); return 'The AI tutor needs permission to use Claude. Reload the page and choose Allow when asked.'; }
  if (c === 'no_key') return 'Add your Anthropic API key in Settings to use the AI tutor.';

  if (c === 'no_credit') return 'Your Anthropic account has no credit left. Add some at console.anthropic.com (Billing), then try again.';
  if (c === 'network') return 'Couldn’t reach the AI. Check your internet connection and try again.';
  if (c === 'overloaded') return 'The AI is very busy right now. Try again in a minute.';
  if (c === 'rate_limited') return 'You have hit a usage limit for now. Wait a little and try again.';
  if (c === 'session_expired') return 'Your Claude session has expired. Sign in again, then retry.';
  if (c === 'image_rejected') return 'That image could not be read. Try a JPG or PNG photo.';
  if (c === 'images_unavailable') return 'Images can’t be sent from this view. Type the question instead.';
  if (c === 'refused') return 'The tutor couldn’t answer that. Try rewording the question.';
  if (c === 'prompt_too_large') return 'That was too long. Send a shorter question.';
  if (c === 'cancelled') return 'Stopped.';

}

async function ai(input, opts={}){
  const s = await samplePromise;
  if (s){
    if (aiBlocked) throw { code:'not_granted' };
    const o = { modelTier: opts.tier || 'default' };
    if (opts.onText) o.onText = opts.onText;
    if (opts.signal) o.signal = opts.signal;
    if (opts.images && opts.images.length) o.images = opts.images;
    if (opts.cache === false) o.cache = false;
    return s(input, o);
  }
  if (!apiKey) throw { code:'no_key' };
  return keyCall(input, opts);
}

/* Direct calls to the Claude API with the student's key, through the official SDK. */
let sdkPromise = null;
const loadSDK = () => sdkPromise || (sdkPromise = import('https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm').catch(e => { sdkPromise = null; throw e; }));

function loadImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => { URL.revokeObjectURL(url); res(im); }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); }; im.src = url; });
}
async function imageBlock(file){
  const im = await loadImage(file);
  const scale = Math.min(1, 1568 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(im.naturalWidth * scale)); c.height = Math.max(1, Math.round(im.naturalHeight * scale));
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
  const data = c.toDataURL('image/jpeg', 0.85).split(',')[1];
  return { type:'image', source:{ type:'base64', media_type:'image/jpeg', data } };
}

async function keyCall(input, opts){
  let mod;
  try { mod = await loadSDK(); } catch(e){ throw { code:'network' }; }
  const Anthropic = mod.default || mod.Anthropic;
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser:true });
  const turns = [];
  (typeof input === 'string' ? [{ role:'user', content:input }] : input).forEach(t => {
    const last = turns[turns.length - 1];
    if (last && last.role === t.role) last.content += '\n\n' + t.content; else turns.push({ role:t.role, content:t.content });
  });
  if (opts.images && opts.images.length){
    let blocks;
    try { blocks = await Promise.all([...opts.images].map(imageBlock)); } catch(e){ throw { code:'image_rejected' }; }
    const last = turns[turns.length - 1];
    last.content = [...blocks, { type:'text', text:last.content }];
  }
  const params = { model: apiModel, max_tokens: 16000, messages: turns, output_config: { effort: 'medium' } };
  if (apiModel !== 'claude-haiku-5-5'){ params.betas = ['server-side-fallback-2026-07-01']; params.fallbacks = 'default'; }
  let acc = '';
  try {
    const stream = client.beta.messages.stream(params, { signal: opts.signal });
    stream.on('text', delta => { acc += delta; opts.onText && opts.onText({ text: acc, delta }); });
    const msg = await stream.finalMessage();
    if (msg.stop_reason === 'refusal') throw { code:'refused' };
    const text = msg.content.filter(b => b.type === 'text').map(b => b.text).join('') || acc;
    if (!text.trim()) throw { code:'empty_completion' };
    return { text, truncated: msg.stop_reason === 'max_tokens' };
  } catch(e){
    const out = { text: acc || undefined };
    if (e && typeof e.code === 'string' && !(e instanceof Error)) out.code = e.code;
    else if ((opts.signal && opts.signal.aborted) || e instanceof mod.APIUserAbortError) out.code = 'cancelled';
    else if (e instanceof mod.AuthenticationError || e instanceof mod.PermissionDeniedError) out.code = 'bad_key';
    else if (e instanceof mod.RateLimitError) out.code = 'rate_limited';
    else if (e instanceof mod.APIConnectionError) out.code = 'network';
    else if (e instanceof mod.BadRequestError && /credit|billing/i.test(e.message || '')) out.code = 'no_credit';
    else if (e instanceof mod.APIError && e.status === 529) out.code = 'overloaded';
    else out.code = 'upstream_error';
    if (out.code === 'refused') delete out.text;
    throw out;
  }
}

const SPEC = R`You are an expert, encouraging A-level Mathematics tutor for the Pearson Edexcel specification (9MA0). The student is studying the Year 1 and Year 2 content: Pure Mathematics, Statistics and Mechanics, following the Pearson Edexcel textbooks. Follow Edexcel conventions: g = 9.8 m s^-2 unless told otherwise; final answers to 3 significant figures or the accuracy the question asks for; mark-scheme codes M (method), A (accuracy, depends on the preceding M), B (independent), dM (dependent method), ft (follow through), cso (correct solution only). In statistics, use Edexcel notation such as X ~ B(n, p), give probabilities to 4 decimal places unless told otherwise, and set out hypothesis tests with H0, H1, the significance level, the comparison and a conclusion in context.`;
const FORMAT = R`Write in Markdown. Put ALL maths in LaTeX using $...$ inline and $$...$$ on its own line for display. Write every fraction as \frac{a}{b} (use \dfrac{a}{b} inside display maths), never with a slash like a/b. Use ^\circ for degrees. Never use \( \) or \[ \] delimiters and never put maths in code blocks. Be clear and concise: short sentences, no filler.`;

function topicLine(topic){
  if (!topic || topic === 'auto') return '';
  const s = SECTIONS[topic];
  return s ? `The student says this is from section ${secNum(s)} "${s.title}" (${s.chapter.book}, ${s.chapter.label} "${s.chapter.title}").` : '';
}

/* Generated questions use a delimited text format, which survives LaTeX backslashes better than JSON. */
const GEN_FORMAT = R`Output format: plain text, no code fences, no preamble. Repeat this block once per question:
===QUESTION===
---stars---
<one whole number from 1 to 5 for the difficulty, using this scale: 1 = one technique, one or two steps (1-3 marks); 2 = standard textbook exercise (3-5 marks); 3 = typical exam question, multi-part with one trap (5-8 marks); 4 = harder exam question: a "hence" chain, unfamiliar context or a mix of sections (7-10 marks); 5 = stretch: needs insight, links chapters, proof or error-spotting (8-12 marks)>
---question---
<question text in Markdown + LaTeX. After each part put its marks as [[n]], e.g. "**(a)** Find ... [[3]]". A question with no parts ends with [[n]].>
---hints---
- <hint 1: a gentle nudge towards the first step, without giving the answer>
- <hint 2: more specific>
- <hint 3 (optional): nearly gives the method>
---scheme---
<part> | <mark code> | <what earns this mark>
<one line per single mark, codes such as M1, A1, B1, dM1, A1ft. Use - as the part when there are no parts. The number of lines must equal the total marks.>
---answer---
<final answers only, each part labelled>
---solution---
<a full worked solution: numbered steps, each with a bold title, the working, and a short reason>`;

function splitFields(b){
  const f = {};
  b.split(/^\s*-{3}\s*([a-z]+)\s*-{3}\s*$/mi).forEach((chunk, j, arr) => { if (j % 2 === 1) f[chunk.toLowerCase()] = (arr[j+1] || '').trim(); });
  return f;
}
function parseGenerated(text, secId){
  const blocks = text.split(/^\s*=+\s*QUESTION\s*=+\s*$/mi).slice(1);
  const out = [], stamp = Date.now().toString(36);
  blocks.forEach((b, i) => {
    const f = splitFields(b);
    if (!f.question || !f.scheme) return;
    const hints = (f.hints || '').split(/\n(?=\s*[-*]\s)/).map(h => h.replace(/^\s*[-*]\s*/, '').trim()).filter(Boolean);
    const scheme = f.scheme.split('\n').map(l => l.trim()).filter(l => l.includes('|')).map(l => {
      const p = l.split('|').map(x => x.trim());
      if (p.length >= 3) return [p[0] === '-' ? '' : p[0], p[1], p.slice(2).join(' | ')];
      return ['', p[0], p[1]];
    }).filter(r => /^[A-Za-z]{1,2}\d/.test(r[1]));
    if (!scheme.length) return;
    const stars = parseInt((f.stars || '').match(/[1-5]/) || 3, 10);
    out.push({ id:`gen-${secId || 'x'}-${stamp}-${i}`, stars, ai:true, q:f.question, hints: hints.length ? hints : ['Start by writing down what you know and what you need to find.'], scheme, answer:f.answer || '', sol:f.solution || '' });
  });
  return out;
}

async function generateQuestions({ basis, n=3, secId, onProgress, signal }){
  const prompt = `${SPEC}

Write ${n} NEW exam-style practice questions in the style of Pearson Edexcel A-level papers.
${basis}
Keep the same techniques, but change the numbers, angles and contexts so the questions are new. Spread the difficulty: make question 1 slightly easier than the source and the last one harder. Every answer must be correct, so work each one out fully before writing it, and choose numbers that give clean or sensible answers. Use g = 9.8 for mechanics.
${FORMAT}

${GEN_FORMAT}`;
  onProgress && onProgress('Writing new questions');
  const { text } = await ai(prompt, { cache:false, signal, onText: ({ text }) => { const k = (text.match(/=+\s*QUESTION\s*=+/gi) || []).length; onProgress && onProgress(k ? `Writing question ${Math.min(k, n)} of ${n}` : 'Writing new questions'); } });
  const qs = parseGenerated(text, secId);
  if (!qs.length) throw { code:'parse' };
  onProgress && onProgress('Checking the answers by solving each question again');
  const verdicts = await verifyQuestions(qs, signal);
  const kept = qs.filter((q, i) => verdicts[i]);
  return { kept, dropped: qs.length - kept.length };
}

/* An independent check: one call solves the questions without seeing the answers, a second compares the two sets. */
async function verifyQuestions(qs, signal){
  const list = qs.map((q, i) => `QUESTION ${i+1}:\n${plainQ(q.q)}`).join('\n\n');
  const solved = (await ai(`${SPEC}

Solve each of these questions carefully and completely. Show brief working, then give the final answer for every part.
Reply in plain text, with one block per question in this format:
===SOLUTION n===
<brief working>
FINAL: <final answers, each part labelled>

${list}`, { cache:false, signal })).text;
  const mine = [];
  solved.split(/^\s*=+\s*SOLUTION\s*(\d+)\s*=+\s*$/mi).forEach((chunk, j, arr) => { if (j % 2 === 1) mine[+chunk - 1] = ((arr[j+1] || '').split(/FINAL:/i)[1] || arr[j+1] || '').trim(); });
  const pairs = qs.map((q, i) => `QUESTION ${i+1}:\n${plainQ(q.q)}\nANSWER A: ${q.answer}\nANSWER B: ${mine[i] || '(no answer)'}`).join('\n\n');
  const cmp = (await ai(`Two people answered the same maths questions independently. For each question, decide whether answers A and B agree on every part. Treat equivalent exact forms, and decimals that agree to the accuracy asked for, as agreeing. If B is missing or either answer is incomplete, they do not agree.
Reply with one line per question and nothing else, in the form "n: AGREE" or "n: DISAGREE".

${pairs}`, { cache:false, signal, tier:'quick' })).text;
  return qs.map((q, i) => new RegExp(`^\\s*${i+1}\\s*[:.)-]\\s*AGREE\\b`, 'mi').test(cmp));
}

async function markAnswer(q, working, images){
  const schemeTxt = q.scheme.map(r => `${r[0] || '-'} | ${r[1]} | ${r[2]}`).join('\n');
  const prompt = `${SPEC}

Mark the student's attempt at this question the way a Pearson Edexcel examiner applies the mark scheme: strictly but fairly. Award an A mark only if the M mark it depends on is earned. Give credit for correct alternative methods. ${images && images.length ? "The student's handwritten working is attached as image(s). Read it carefully." : ''}

QUESTION:
${plainQ(q.q)}

MARK SCHEME (part | code | requirement), ${q.scheme.length} lines:
${schemeTxt}

FINAL ANSWER: ${q.answer}

STUDENT'S TYPED WORKING:
"""
${working || '(none typed; see the attached image)'}
"""

Reply in exactly this plain-text format, with no code fences:
SCORE: <marks awarded>/<total>
---marks---
<part> | <code> | yes or no | <one short comment on what they did or what was missing>
(exactly ${q.scheme.length} lines, one per mark scheme line, in the same order)
---feedback---
<2 to 4 sentences in Markdown with LaTeX: what went well, the key error if there is one, and exactly how to fix it>`;
  const parse = text => {
    const marks = [];
    const mSec = (text.split(/---\s*marks\s*---/i)[1] || '').split(/---\s*feedback\s*---/i)[0];
    mSec.split('\n').forEach(l => { const p = l.split('|').map(x => x.trim()); if (p.length >= 3 && /^(yes|no)$/i.test(p[2])) marks.push({ part:p[0], code:p[1], ok:/^yes$/i.test(p[2]), note:p.slice(3).join(' | ') }); });
    return { marks, feedback: (text.split(/---\s*feedback\s*---/i)[1] || '').trim() };
  };
  let res = parse((await ai(prompt, { cache:false, images, tier:'default' })).text);
  if (res.marks.length !== q.scheme.length) res = parse((await ai(prompt, { cache:false, images, tier:'default' })).text);
  if (res.marks.length !== q.scheme.length) throw { code:'mark_mismatch' };
  return res;
}

    <div class="panel" data-p="hints" hidden></div>
    <div class="panel" data-p="ai" hidden></div>
    <div class="panel" data-p="scheme" hidden></div>
    <div class="panel" data-p="sol" hidden></div>`;
  setMD($('.qbody', el), q.q);
  const ta = $('textarea', el);
  ta.value = saved.work[q.id] || '';
  let t; ta.oninput = () => { clearTimeout(t); t = setTimeout(() => { saved.work[q.id] = ta.value; persist(); }, 400); };
  const thumbs = $('.thumbs', el);
  $('input[type=file]', el).onchange = e => { addImages(st.imgs, e.target.files); e.target.value = ''; renderThumbs(thumbs, st.imgs); };
  const status = $('[data-status]', el);
  const say = (msg, err) => { status.hidden = !msg; status.textContent = msg || ''; status.className = 'status' + (err ? ' err' : ''); };

  if (timer){
    const tEl = $('[data-timer]', el), limit = Math.round(total * 72), start = Date.now();
    tEl.hidden = false;
    let shown = false;
    const tick = () => {
      if (el.isConnected) shown = true;
      else if (shown) return clearInterval(iv);
      const left = limit - Math.floor((Date.now() - start) / 1000), a = Math.abs(left);
      tEl.textContent = `${left < 0 ? 'Over by ' : ''}${Math.floor(a / 60)}:${String(a % 60).padStart(2, '0')}`;
      tEl.classList.toggle('over', left < 0);
    };
    const iv = setInterval(tick, 1000); tick();
  }
  function scoreLine(){
    const got = st.ticks.filter(Boolean).length;
    return `<span class="big">${got}/${total}</span><span class="muted small">Tick the marks you earned. Your score is saved on this device.</span>`;
  }
  function saveScore(){
    const got = st.ticks.filter(Boolean).length;
    saved.scores[q.id] = { got, total, ticks: st.ticks.slice(), at: Date.now() };
    persist(); onChange && onChange();
    const sc = $('[data-score]', el); if (sc) sc.innerHTML = scoreLine();
  }
  function renderHints(){
    const p = $('[data-p="hints"]', el);
    p.hidden = st.hints === 0;
    p.innerHTML = `<div class="panel-title">Hints</div>` + q.hints.slice(0, st.hints).map((h, i) => `<div class="hint"><b>${i+1}.</b><div class="md">${md(h)}</div></div>`).join('');
    const b = $('[data-act="hint"]', el);
    const left = q.hints.length - st.hints;
    b.innerHTML = left ? `${st.hints ? 'Next hint' : 'Hint'} <span class="count">${left} left</span>` : 'No more hints';
    b.disabled = !left;
  }
  function renderScheme(){
    const p = $('[data-p="scheme"]', el);
    p.hidden = !st.scheme;
    if (!st.scheme) return;
    const hasParts = q.scheme.some(r => r[0]);
    p.innerHTML = `<div class="panel-title">Mark scheme</div>
      <div class="scheme-wrap"><table class="scheme"><thead><tr>${hasParts ? '<th>Part</th>' : ''}<th>Scheme</th><th>Marks</th><th>Earned?</th></tr></thead><tbody>
      ${q.scheme.map((r, i) => `<tr>${hasParts ? `<td class="part">${esc(r[0])}</td>` : ''}<td class="md">${md(r[2])}</td><td class="code">${esc(r[1])}</td><td class="tick"><input type="checkbox" aria-label="Earned ${esc(r[1])}" data-tick="${i}" ${st.ticks[i] ? 'checked' : ''}></td></tr>`).join('')}
      <tr class="final">${hasParts ? '<td class="part">Ans</td>' : ''}<td class="md" colspan="3">${md(q.answer)}</td></tr>
      </tbody></table></div>
      <div class="score" data-score>${scoreLine()}</div>`;
    $$('[data-tick]', p).forEach(c => c.onchange = () => { st.ticks[+c.dataset.tick] = c.checked; saveScore(); });
  }
  function renderSol(){
    const p = $('[data-p="sol"]', el);
    p.hidden = !st.sol;
    if (!st.sol) return;
    p.innerHTML = `<div class="panel-title">Worked solution</div>${q.solFig ? `<div class="qfig">${q.solFig}</div>` : ''}<div class="md">${md(q.sol)}</div>`;
  }
  let delArmed = false;
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act;
    if (act === 'hint'){ st.hints = Math.min(q.hints.length, st.hints + 1); renderHints(); }
    if (act === 'scheme'){ st.scheme = !st.scheme; b.textContent = st.scheme ? 'Hide mark scheme' : 'Mark scheme'; renderScheme(); }
    if (act === 'sol'){ st.sol = !st.sol; b.textContent = st.sol ? 'Hide solution' : 'Full solution'; renderSol(); }
    if (act === 'ask') sendToTutor(q, ta, secId, 'solve');
    if (act === 'guide') sendToTutor(q, ta, secId, 'guide');
    if (act === 'report') sendToTutor(q, null, secId, 'solve', `I think this practice question, its mark scheme or its answer may contain a mistake. Please check it carefully: solve it yourself, compare with the given answer, and tell me clearly whether it is correct.\n\nQUESTION:\n${plainQ(q.q)}\n\nGIVEN ANSWER:\n${q.answer}`);
    if (act === 'del'){
      if (!delArmed){ delArmed = true; b.textContent = 'Tap again to delete'; setTimeout(() => { delArmed = false; if (b.isConnected) b.textContent = 'Delete this question'; }, 4000); return; }
      onDelete && onDelete(q);
    }
    if (act === 'mark'){
      if (!ta.value.trim() && !st.imgs.length){ say('Write your working or attach a photo first, then press Mark my answer.', true); ta.focus(); return; }
      b.disabled = true; say('Marking your answer against the mark scheme'); status.classList.add('thinking');
      try {
        const res = await markAnswer(q, ta.value.trim(), st.imgs.map(i => i.file));
        status.classList.remove('thinking'); say('');
        st.ticks = res.marks.map(m => m.ok); saveScore(); if (st.scheme) renderScheme();
        const got = res.marks.filter(m => m.ok).length;
        const p = $('[data-p="ai"]', el); p.hidden = false;
        p.innerHTML = `<div class="panel-title">Tutor marking</div>
          <div class="score"><span class="big">${got}/${total}</span><span class="muted small">Marked against the Edexcel-style scheme</span></div>
          <div class="scheme-wrap"><table class="scheme"><tbody>${res.marks.map(m => `<tr><td class="part">${esc(m.part === '-' ? '' : m.part)}</td><td class="code">${esc(m.code)}</td><td><span class="verdict ${m.ok ? 'yes' : 'no'}">${m.ok ? 'Earned' : 'Not earned'}</span></td><td class="md">${md(m.note)}</td></tr>`).join('')}</tbody></table></div>
          <div class="md">${md(res.feedback)}</div>`;
      } catch(err){
        status.classList.remove('thinking');
        say(err.code === 'mark_mismatch' ? 'The tutor’s marking didn’t line up with the mark scheme, even after a second try, so it wasn’t saved. Use the mark scheme to mark it yourself, or try again.' : errText(err), true);
      }
      b.disabled = false;
    }
  });
  renderHints();
  return el;
}

const view = $('#view');
function go(v, opts={}){
  Object.assign(state, { view:v }, opts);
  render();
  window.scrollTo({ top:0 });
}
function render(){
  $$('.nav [data-go]').forEach(b => b.setAttribute('aria-current', (b.dataset.go === state.view || (b.dataset.go === 'home' && state.view === 'section')) ? 'page' : 'false'));
  if (state.view === 'section') renderSection();
  else if (state.view === 'ask') renderAsk();
  else if (state.view === 'settings') renderSettings();
  else renderHome();
  refreshAI();
}

function renderHome(){
  view.innerHTML = `
    <section class="intro">
      <span class="eyebrow">Pearson Edexcel · A level Mathematics</span>
      <h1>Pick a topic to learn or practise</h1>
      <p>Every section of the Year 1 and Year 2 courses has clear notes, worked examples, and 15 exam-style questions rated from one to five stars, each with hints, a mark scheme and a full solution. Stuck on a question from class or a past paper? Send it to the tutor as text or a photo.</p>
    </section>
    <div class="books">${[...new Set(CHAPTERS.map(ch => ch.book))].map(book => `<section class="book"><h2 class="book-title">${esc(book)}</h2><div class="chapters">${CHAPTERS.filter(ch => ch.book === book).map(ch => {
      const all = progress(questionsFor(ch.id)); const pct = all.tot ? Math.round(100 * all.got / all.tot) : 0;
      return `<details class="chapter" data-ch="${ch.id}" ${openChapters().includes(ch.id) ? 'open' : ''}>
        <summary class="ch-head"><div><span class="eyebrow">${esc(ch.label)} · ${ch.sections.length} sections</span><h3>${esc(ch.title)}</h3></div>
          <span class="sec-prog"><span class="bar"><i style="width:${pct}%"></i></span>${all.got}/${all.tot}</span></summary>
        <div class="ch-tools"><button class="btn small" type="button" data-mix="${ch.id}">Mixed practice for this chapter</button></div>
        ${ch.sections.map(s => { const p = progress(questionsFor(s.id)); const pct = p.tot ? Math.round(100 * p.got / p.tot) : 0;
          return `<div class="sec-row"><span class="sec-num">${secNum(s)}</span>
            <button class="sec-title" type="button" data-learn="${s.id}">${esc(s.title)}</button>
            <div class="sec-prog" title="${p.done} of ${questionsFor(s.id).length} questions marked"><span class="bar"><i style="width:${pct}%"></i></span>${p.got}/${p.tot} marks</div>
            <div class="sec-acts"><button class="btn small ghost" type="button" data-learn="${s.id}">Learn</button><button class="btn small" type="button" data-prac="${s.id}">Practise</button></div></div>`; }).join('')}
      </details>`; }).join('')}</div></section>`).join('')}</div>
    <div class="ask-cta"><div><h3>Got a question of your own?</h3><p>Type it, paste a screenshot or take a photo. The tutor reads it, solves it step by step or guides you one step at a time, and can write similar questions for you to try.</p></div>
      <button class="btn primary" type="button" data-go-ask>Ask the tutor</button></div>`;
  $$('[data-learn]', view).forEach(b => b.onclick = () => go('section', { sec:b.dataset.learn, tab:'learn', qi:0 }));
  $$('[data-prac]', view).forEach(b => b.onclick = () => go('section', { sec:b.dataset.prac, tab:'practise', qi:0 }));
  $$('[data-mix]', view).forEach(b => b.onclick = () => go('section', { sec:b.dataset.mix, tab:'practise', qi:0 }));
  $('[data-go-ask]', view).onclick = () => go('ask');
  $$('details.chapter', view).forEach(d => d.addEventListener('toggle', () => {
    const open = new Set(openChapters()); d.open ? open.add(d.dataset.ch) : open.delete(d.dataset.ch);
    try { localStorage.setItem('edexcel-tutor-open', JSON.stringify([...open])); } catch(e){}
  }));
}
function openChapters(){ try { return JSON.parse(localStorage.getItem('edexcel-tutor-open')) || []; } catch(e){ return []; } }

const PAST_PAPERS = 'https://qualifications.pearson.com/en/qualifications/edexcel-a-levels/mathematics-2017.coursematerials.html#filterQuery=category:Pearson-UK:Category%2FExam-materials';
const shuffled = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const secOfQ = q => SECTIONS[q.id.split('-')[0]] ? q.id.split('-')[0] : (q.id.startsWith('gen-') ? q.id.split('-')[1] : null);

function renderSection(){
  const s = SECTIONS[state.sec];
  const ch = s ? s.chapter : CHAPTERS.find(c => c.id === state.sec);
  if (!ch){ return go('home'); }
  const isMix = !s;
  if (isMix) state.tab = 'practise';
  const all = questionsFor(state.sec);
  view.innerHTML = `
    <div class="sec-header">
      <div><p class="crumbs"><button type="button" data-home>Topics</button> / ${esc(ch.book)} · ${esc(ch.label)}</p>
      <h1>${isMix ? 'Mixed practice: ' + esc(ch.title) : `<span class="sec-num">${secNum(s)}</span> ${esc(s.title)}`}</h1></div>
      ${isMix ? '' : `<div class="tabs" role="tablist"><button role="tab" type="button" data-tab="learn" aria-selected="${state.tab === 'learn'}">Learn</button><button role="tab" type="button" data-tab="practise" aria-selected="${state.tab === 'practise'}">Practise (${all.length})</button></div>`}
    </div>
    <div id="sec-body"></div>`;
  $('[data-home]', view).onclick = () => go('home');
  $$('[data-tab]', view).forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.qi = 0; renderSection(); });
  const body = $('#sec-body');
  if (state.tab === 'learn' && s){
    body.innerHTML = `<article class="notes"><div class="md" id="notes-md"></div>
      <div class="notes-foot"><button class="btn primary" type="button" data-go-prac>Practise ${secNum(s)} · ${all.length} questions</button></div></article>
      <div class="stuck"><h3>Real exam questions</h3><p class="muted small">Past papers and mark schemes for this course (9MA0) are free to download from Pearson. Paper 1 and Paper 2 cover the pure topics; Paper 3 Section B covers mechanics.</p>
        <p><a href="${PAST_PAPERS}" target="_blank" rel="noopener">Open Pearson past papers</a></p></div>
      <div class="stuck"><h3>Still confused about ${esc(s.title.toLowerCase())}?</h3><p class="muted small">Ask anything about this topic and the tutor will explain it.</p>
        <form class="row" id="stuck-form"><input id="stuck-q" placeholder="e.g. Why does the sign flip in the cos formula?" aria-label="Your question about this topic"><button class="btn" type="submit">Ask the tutor</button></form></div>`;
    setMD($('#notes-md'), s.notes);
    $('[data-go-prac]', body).onclick = () => { state.tab = 'practise'; state.qi = 0; renderSection(); };
    $('#stuck-form').onsubmit = e => { e.preventDefault(); const v = $('#stuck-q').value.trim(); if (!v) return; state.ask.text = v; state.ask.topic = s.id; state.ask.autoMode = 'solve'; go('ask'); };
    return;
  }

  const P = state.prac = state.prac && state.prac.sec === state.sec ? state.prac : { sec: state.sec, stars: 0, timed: false, order: isMix ? shuffled(all.map(q => q.id)) : null };
  let qs = [];
  function rebuild(){
    const pool = questionsFor(state.sec);
    if (P.order){ const known = new Set(P.order); pool.forEach(q => { if (!known.has(q.id)) P.order.push(q.id); }); }
    const byId = Object.fromEntries(pool.map(q => [q.id, q]));
    const ordered = P.order ? P.order.map(id => byId[id]).filter(Boolean) : pool;
    qs = P.stars ? ordered.filter(q => starsOf(q) === P.stars) : ordered;
    state.qi = Math.max(0, Math.min(state.qi, qs.length - 1));
  }
  rebuild();
  const counts = [1,2,3,4,5].map(n => questionsFor(state.sec).filter(q => starsOf(q) === n).length);
  body.innerHTML = `
    <div class="filters">
      <div class="chips" role="group" aria-label="Filter by difficulty">
        <button type="button" class="chip" data-star="0" aria-pressed="${!P.stars}">All</button>
        ${[1,2,3,4,5].map(n => `<button type="button" class="chip" data-star="${n}" aria-pressed="${P.stars === n}" title="${esc(STAR_RUBRIC[n-1])}" ${counts[n-1] ? '' : 'disabled'}>${'★'.repeat(n)} <span class="count">${counts[n-1]}</span></button>`).join('')}
      </div>
      <div class="chips">
        ${isMix ? '<button type="button" class="chip" id="reshuffle">Shuffle again</button>' : ''}
        <label class="chip"><input type="checkbox" id="timed" ${P.timed ? 'checked' : ''}> Timed (72 seconds a mark)</label>
      </div>
    </div>
    <p class="muted small" id="star-note">${P.stars ? esc(STAR_RUBRIC[P.stars-1]) : ''}</p>
    <div class="qnav" id="qnav"></div><div id="qslot"></div>
    <div class="gen-bar"><p>Done these? The tutor can write more questions in the same style. Each one is checked by solving it again independently, and any that don't agree are thrown away.</p>
      <button class="btn" type="button" id="gen-btn">Write 3 new questions</button><span class="status" id="gen-status" hidden></span></div>
    <p class="notice" data-ai-note hidden>${aiOffHTML()}</p>`;
  $$('[data-star]', body).forEach(b => b.onclick = () => { P.stars = +b.dataset.star; state.qi = 0; renderSection(); });
  const rs = $('#reshuffle'); if (rs) rs.onclick = () => { P.order = shuffled(questionsFor(state.sec).map(q => q.id)); state.qi = 0; renderSection(); };
  $('#timed').onchange = e => { P.timed = e.target.checked; drawQ(); };
  const nav = $('#qnav');
  function drawNav(){
    nav.innerHTML = qs.map((q, i) => { const sc = saved.scores[q.id]; const cls = sc ? (sc.got === sc.total ? 'done' : 'part') : '';
      return `<button type="button" class="qpill ${cls} ${q.ai ? 'ai' : ''}" data-qi="${i}" aria-current="${i === state.qi}" aria-label="Question ${i+1}, ${starsOf(q)} stars${sc ? `, scored ${sc.got} of ${sc.total}` : ''}">${i+1}</button>`; }).join('')
      + `<span class="sec-prog" style="margin-left:auto">${(p => `${p.got}/${p.tot} marks`)(progress(qs))}</span>`;
    $$('[data-qi]', nav).forEach(b => b.onclick = () => { state.qi = +b.dataset.qi; drawQ(); drawNav(); });
  }
  function drawQ(){
    const slot = $('#qslot'); slot.innerHTML = '';
    const q = qs[state.qi];
    if (!q){ slot.innerHTML = '<p class="muted">No questions at this difficulty yet.</p>'; return; }
    const secId = secOfQ(q) || state.sec;
    const label = `Question ${state.qi + 1}` + (isMix && SECTIONS[secId] ? ` · ${secNum(SECTIONS[secId])}` : '');
    slot.appendChild(questionCard(q, label, { onChange: drawNav, secId, timer: P.timed,
      onDelete: dq => { const k = secOfQ(dq); saved.gen[k] = (saved.gen[k] || []).filter(x => x.id !== dq.id); delete saved.scores[dq.id]; delete saved.work[dq.id]; persist(); rebuild(); renderSection(); } }));
    const pager = document.createElement('div'); pager.className = 'actions'; pager.style.marginTop = '12px';
    pager.innerHTML = `<button class="btn ghost" type="button" ${state.qi === 0 ? 'disabled' : ''} data-pg="-1">← Previous</button><button class="btn ghost" type="button" ${state.qi >= qs.length - 1 ? 'disabled' : ''} data-pg="1">Next →</button>`;
    $$('[data-pg]', pager).forEach(b => b.onclick = () => { state.qi += +b.dataset.pg; drawQ(); drawNav(); window.scrollTo({ top: nav.offsetTop - 80 }); });
    slot.appendChild(pager);
    refreshAI();
  }
  drawNav(); drawQ();
  $('#gen-btn').onclick = async () => {
    const btn = $('#gen-btn'), st = $('#gen-status');
    const targetSec = s ? s.id : ch.sections[Math.floor(Math.random() * ch.sections.length)].id;
    const ts = SECTIONS[targetSec];
    btn.disabled = true; st.hidden = false; st.className = 'status thinking';
    const want = P.stars || 0;
    const sample = shuffled(ts.questions.filter(q => !want || starsOf(q) === want)).slice(0, 3);
    const examples = (sample.length ? sample : ts.questions.slice(0, 3)).map((q, i) => `Example ${i+1} (${starsOf(q)} stars):\n${plainQ(q.q)}`).join('\n\n');
    try {
      const { kept, dropped } = await generateQuestions({ secId: targetSec, n: 3,
        basis: `Topic: section ${secNum(ts)} "${ts.title}" from ${ts.chapter.book}, ${ts.chapter.label} "${ts.chapter.title}".${want ? ` Make every question ${want} stars on the scale below.` : ''} Here are questions the student has been practising:\n\n${examples}`,
        onProgress: m => { st.textContent = m; } });
      saved.gen[targetSec] = (saved.gen[targetSec] || []).concat(kept).slice(-30); persist();
      const before = qs.length;
      rebuild();
      state.qi = kept.length ? Math.min(before, qs.length - 1) : state.qi;
      st.className = 'status';
      st.textContent = kept.length
        ? `Added ${kept.length} new question${kept.length > 1 ? 's' : ''}${s ? '' : ` on ${secNum(ts)} ${ts.title}`}.${dropped ? ` ${dropped} was thrown away because the check didn't agree with its answer.` : ''}`
        : 'None of the new questions passed the answer check, so none were added. Try again.';
      drawNav(); drawQ();
    } catch(err){ st.className = 'status err'; st.textContent = err.code === 'parse' ? 'The new questions came back in an unexpected format. Try again.' : errText(err); }
    btn.disabled = false;
  };
}

      await keyCall('Reply with the single word OK.', {});
      lsSet(KEY_STORE, apiKey); refreshAI();
      say('Key saved and working. The AI tutor is on.');
      $('#api-key').value = ''; $('#api-key').placeholder = 'Key saved: ' + apiKey.slice(0, 10) + '…'; $('#key-remove').hidden = false;
    } catch(err){
      apiKey = prev; refreshAI();
      say(errText(err), true);
    }
  };
}

/* ------------------------------------------------------------------ */
/* Ask the tutor                                                      */
/* ------------------------------------------------------------------ */
const EXAMPLES = [
  'Solve 2cos 2x = 1 - sin x for 0 ≤ x < 360°',
  'Express 5 sin x - 12 cos x in the form R sin(x - α)',
  'A 6 kg block is pulled up a rough slope at 25° by a force of 50 N parallel to the slope. μ = 0.3. Find the acceleration.'
];
function renderAsk(){
  const A = state.ask;
  view.innerHTML = `
    <section class="intro"><span class="eyebrow">Your own questions</span><h1>Ask the tutor</h1>
      <p>Type a question, paste a screenshot, or attach a photo of a textbook or past-paper question. Choose <b>Solve step by step</b> to see a full worked solution, or <b>Guide me</b> to work through it yourself one step at a time, with the tutor checking each step.</p></section>
    <p class="notice" data-ai-note hidden>${aiOffHTML()}</p>
    <form class="composer" id="ask-form">
      <label class="lbl eyebrow" for="ask-text">Question</label>
      <textarea id="ask-text" rows="5" placeholder="Type or paste the question here. You can also add an image below.">${esc(A.text)}</textarea>
      <div class="drop" id="drop" data-ai-img>Drop an image here, paste one (Ctrl/Cmd + V), or <label>choose a photo<input type="file" id="ask-file" accept="image/*" multiple hidden></label></div>
      <div class="thumbs" id="ask-thumbs"></div>
      <div class="comp-row">
        <select id="ask-topic" aria-label="Topic">
          <option value="auto">Topic: work it out for me</option>
          ${CHAPTERS.map(ch => `<optgroup label="${esc(ch.book.replace('Mathematics ', '').replace('Statistics & Mechanics', 'Applied'))} · ${esc(ch.label)} · ${esc(ch.title)}">${ch.sections.map(s => `<option value="${s.id}" ${A.topic === s.id ? 'selected' : ''}>${secNum(s)} ${esc(s.title)}</option>`).join('')}</optgroup>`).join('')}
        </select>
        <div class="actions"><button class="btn ghost" type="button" id="ask-new" ${A.items.length ? '' : 'hidden'}>New question</button><button class="btn" type="button" id="ask-guide">Guide me</button><button class="btn primary" type="submit" id="ask-go">Solve step by step</button></div>
      </div>
      <div class="examples" ${A.items.length ? 'hidden' : ''}><span class="muted small">Try:</span>${EXAMPLES.map((x, i) => `<button type="button" class="chip" data-ex="${i}">${esc(x.length > 46 ? x.slice(0, 44) + '…' : x)}</button>`).join('')}</div>
    </form>
    <div class="thread" id="thread"></div>`;
  const ta = $('#ask-text'), thumbs = $('#ask-thumbs');
  ta.oninput = () => { A.text = ta.value; };
  $('#ask-topic').onchange = e => { A.topic = e.target.value; };
  const redrawThumbs = () => renderThumbs(thumbs, A.imgs);
  redrawThumbs();
  $('#ask-file').onchange = e => { addImages(A.imgs, e.target.files); e.target.value = ''; redrawThumbs(); };
  const drop = $('#drop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addImages(A.imgs, e.dataTransfer.files); redrawThumbs(); };
  $('#ask-form').onpaste = e => { const files = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => f.type.startsWith('image/')); if (files.length && imgCaps()){ e.preventDefault(); addImages(A.imgs, files); redrawThumbs(); } };
  $$('[data-ex]').forEach(b => b.onclick = () => { ta.value = A.text = EXAMPLES[+b.dataset.ex]; ta.focus(); });
  $('#ask-new').onclick = () => { A.turns = []; A.items = []; A.text = ''; A.imgs.forEach(i => URL.revokeObjectURL(i.url)); A.imgs = []; renderAsk(); };
  $('#ask-form').onsubmit = e => { e.preventDefault(); startSolve('solve'); };
  $('#ask-guide').onclick = () => startSolve('guide');
  drawThread();
  if (A.autoMode){ const m = A.autoMode; A.autoMode = null; if (A.text.trim()) startSolve(m); }
}

let askCtl = null;
function drawThread(){
  const A = state.ask, th = $('#thread'); if (!th) return;
  th.innerHTML = '';
  A.items.forEach(it => {
    if (it.kind === 'me'){
      const d = document.createElement('div'); d.className = 'msg-me';
      d.innerHTML = `${it.text ? `<p>${esc(it.text)}</p>` : ''}${it.imgs && it.imgs.length ? `<div class="thumbs">${it.imgs.map((u, i) => `<div class="thumb"><img src="${u}" alt="Your image ${i+1}"></div>`).join('')}</div>` : ''}`;
      th.appendChild(d);
    } else if (it.kind === 'tutor'){
      const d = document.createElement('article'); d.className = 'sheet';
      d.innerHTML = `<div class="who"><span>Tutor${A.mode === 'guide' ? ' · guiding you' : ''}</span>${it.live ? '<button class="btn small ghost" type="button" data-stop>Stop</button>' : ''}</div><div class="md" data-body></div>${it.error ? `<p class="status err">${esc(it.error)}</p>` : ''}`;
      const body = $('[data-body]', d);
      if (it.text){ body.innerHTML = md(it.text); } else body.innerHTML = '<p class="status thinking">Reading the question and working it out</p>';
      it.el = body;
      const stop = $('[data-stop]', d); if (stop) stop.onclick = () => askCtl && askCtl.abort();
      th.appendChild(d);
    } else if (it.kind === 'qs'){
      const wrap = document.createElement('div'); wrap.style.display = 'grid'; wrap.style.gap = '14px';
      wrap.innerHTML = `<div class="who eyebrow">Similar questions to try</div>`;
      it.qs.forEach((q, i) => wrap.appendChild(questionCard(q, `Try this ${i+1}`, { secId: A.topic })));
      th.appendChild(wrap);
    } else if (it.kind === 'status'){
      const p = document.createElement('p'); p.className = 'status' + (it.err ? ' err' : it.done ? '' : ' thinking'); p.textContent = it.text; th.appendChild(p);
    }
  });
  if (A.items.length && !A.busy && A.turns.length){
    const f = document.createElement('div'); f.className = 'follow';
    if (A.mode === 'guide'){
      f.innerHTML = `<h3>Your turn</h3>
        <form class="row" id="fu-form"><input id="fu-text" placeholder="Type your attempt at this step" aria-label="Your attempt at this step"><button class="btn primary" type="submit">Check my step</button></form>
        <div class="row">
          <button class="btn" type="button" data-fu="hint">I'm stuck: give me a hint</button>
          <button class="btn" type="button" data-fu="show">Show me this step</button>
          <button class="btn" type="button" data-fu="full">Show the full solution</button>
          <button class="btn" type="button" data-fu="similar">Give me similar questions</button>
        </div>`;
    } else {
      f.innerHTML = `<h3>Still not clear?</h3>
        <div class="row">
          <button class="btn" type="button" data-fu="simpler">Explain it more simply</button>
          <button class="btn" type="button" data-fu="method">Show a different method</button>
          <button class="btn primary" type="button" data-fu="similar">Give me similar questions to try</button>
        </div>
        <form class="row" id="fu-form"><input id="fu-text" placeholder="Ask about a step, e.g. Why did we divide by cos x in step 3?" aria-label="Follow-up question"><button class="btn" type="submit">Ask</button></form>`;
    }
    th.appendChild(f);
    const FU = {
      simpler: 'I still don\'t understand. Explain it again more simply: use plain everyday language, smaller steps, and say what each symbol means. Point out the single key idea that makes it work. Keep the same Markdown and LaTeX format.',
      method: 'Show me a different method for the same question, if there is a sensible one, and say when each method is the better choice. Keep the same Markdown and LaTeX format.',
      hint: "I'm stuck on this step. Give me a hint for it, without doing it for me.",
      show: 'Show me how to do this step, with the working, then ask me to try the next step.',
      full: 'Please show the rest of the solution in full now, step by step, then give the final answer and one exam tip.'
    };
    $$('[data-fu]', f).forEach(b => b.onclick = () => b.dataset.fu === 'similar' ? makeSimilar() : followUp(FU[b.dataset.fu], b.textContent));
    $('#fu-form').onsubmit = e => {
      e.preventDefault(); const v = $('#fu-text').value.trim(); if (!v) return;
      followUp(A.mode === 'guide' ? `My attempt at this step:\n${v}` : v + '\n\n(Answer in the same Markdown and LaTeX format, concisely.)', v);
    };
  }
  $('#ask-new') && ($('#ask-new').hidden = !A.items.length);
  const ex = $('.examples'); if (ex) ex.hidden = !!A.items.length;
  refreshAI();
}

function solvePrompt(text, hasImg, topic){
  return `${SPEC}
${FORMAT}

The student has sent a question${hasImg ? ' as an image (a photo or screenshot), possibly with some typed text' : ''}. ${topicLine(topic)}
Reply with exactly these sections:
## The question
Write out the question exactly as you read it, including every part and the marks if shown. If any part of an image is unclear, say which part and give your best reading.
## What it's testing
One or two lines naming the technique, and the Edexcel textbook section if it matches one.
## Step-by-step solution
Numbered steps. Each step has a short bold title, the working, and one sentence on why that step is done. Where a step would earn a mark in an Edexcel mark scheme, tag it at the end like **(M1)**, **(A1)** or **(B1)**. Answer every part (a), (b), ... in order, with a bold part label.
## Final answer
The final answer for each part, clearly stated.
## Exam tips
Up to 3 short bullets on the mistakes examiners commonly see on this type of question.

Student's message:
"""
${text || '(no text, see the image)'}
"""`;
}

function guidePrompt(text, hasImg, topic){
  return `${SPEC}
${FORMAT}

The student has sent a question${hasImg ? ' as an image (a photo or screenshot), possibly with some typed text' : ''}. ${topicLine(topic)}
Guide them through it ONE STEP AT A TIME so that they do the work. Never give the whole solution at once, and never give away a step's answer before they have tried it.

Your first reply has exactly these sections:
## The question
Write out the question exactly as you read it, including every part and the marks if shown. If any part of an image is unclear, say which part and give your best reading.
## The plan
One or two sentences naming the method, with no working.
## Step 1
Say what this first step is and why, then ask the student a direct question to try it. Stop there.

Every later message from the student is their attempt at the current step, or a request. Then:
- If their step is right: say so in a few words, show the correct line, then give the next step as a question.
- If it is wrong or incomplete: name the exact problem kindly, give a hint, and ask them to try again. Only show the step's working if they ask you to, or have tried twice.
- When every step is done: give **## Final answer** for each part and one exam tip.
Keep each reply short: under 120 words plus the maths.

Student's message:
"""
${text || '(no text, see the image)'}
"""`;
}

async function streamTutor(turns, images){
  const A = state.ask;
  const item = { kind:'tutor', text:'', live:true };
  A.items.push(item); A.busy = true; drawThread();
  askCtl = new AbortController();
  let raf = 0;
  try {
    const { text, truncated } = await ai(turns, { cache:false, images, signal: askCtl.signal, tier:'default',
      onText: ({ text }) => { item.text = text; if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (item.el) item.el.innerHTML = md(item.text); }); } });
    item.text = text + (truncated ? '\n\n*The answer was cut short. Ask a follow-up to continue.*' : '');
    A.turns.push({ role:'assistant', content: text });
  } catch(err){
    item.text = err.text || item.text || '';
    item.error = errText(err);
    if (A.turns.length && A.turns[A.turns.length - 1].role === 'user' && !item.text) A.turns.pop();
    else if (item.text) A.turns.push({ role:'assistant', content:item.text });
  }
  item.live = false; A.busy = false; drawThread();
}

async function startSolve(mode){
  const A = state.ask;
  if (A.busy) return;
  const text = ($('#ask-text').value || '').trim();
  if (!text && !A.imgs.length){ $('#ask-text').focus(); return; }
  const files = A.imgs.map(i => i.file);
  A.mode = mode;
  A.turns = [{ role:'user', content: (mode === 'guide' ? guidePrompt : solvePrompt)(text, files.length > 0, A.topic) }];
  A.items = [{ kind:'me', text, imgs: A.imgs.map(i => i.url) }];
  A.firstQuestion = text;
  A.imgs = []; A.text = '';
  $('#ask-text').value = ''; renderThumbs($('#ask-thumbs'), A.imgs);
  await streamTutor(A.turns.slice(), files);
}

async function followUp(instruction, shown){
  const A = state.ask;
  if (A.busy) return;
  A.items.push({ kind:'me', text: shown });
  A.turns.push({ role:'user', content: instruction });
  // Keep turn 0 (instructions and question) and turn 1 (the tutor's first answer); drop the oldest follow-up pair.
  if (A.turns.length > 12) A.turns.splice(2, 2);
  await streamTutor(A.turns.slice());
}

async function makeSimilar(){
  const A = state.ask;
  if (A.busy) return;
  const firstAnswer = (A.turns.find(t => t.role === 'assistant') || {}).content || '';
  const qPart = (firstAnswer.split(/##\s*(What it'?s testing|The plan)/i)[0] || firstAnswer).slice(0, 4000);
  A.items.push({ kind:'me', text:'Give me similar questions to try' });
  const st = { kind:'status', text:'Writing similar questions' };
  A.items.push(st); A.busy = true; drawThread();
  try {
    const { kept, dropped } = await generateQuestions({ n:3, secId: A.topic !== 'auto' ? A.topic : 'ask',
      basis: `The student was stuck on this question:\n\n${qPart}\n\n${A.firstQuestion ? 'Their original message: ' + A.firstQuestion.slice(0, 1500) : ''}\nWrite questions that practise exactly the same skills.`,
      onProgress: m => { st.text = m; const s = $$('#thread .status.thinking').pop(); if (s) s.textContent = m; } });
    const note = dropped ? { kind:'status', done:true, text:`${dropped} question${dropped > 1 ? 's were' : ' was'} thrown away because the answer check didn't agree.` } : null;
    A.items.splice(A.items.indexOf(st), 1, ...(kept.length ? [{ kind:'qs', qs: kept }] : []), ...(note ? [note] : []));
    if (!kept.length) A.items.push({ kind:'status', err:true, text:'None of the questions passed the answer check. Press the button again.' });
    if (A.topic !== 'auto' && SECTIONS[A.topic] && kept.length){ saved.gen[A.topic] = (saved.gen[A.topic] || []).concat(kept).slice(-30); persist(); }
  } catch(err){ st.err = true; st.text = err.code === 'parse' ? 'The questions came back in an unexpected format. Press the button again.' : errText(err); }
  A.busy = false; drawThread();
}
